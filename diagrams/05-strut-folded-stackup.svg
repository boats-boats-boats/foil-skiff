<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" width="1040" height="560">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1038" height="558" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="492" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">5. Strut Architecture &amp; Folded Beaching Stack-Up Inside a Ø460 mm Catamaran Tunnel</text>
  <text x="24" y="46" class="sub">Front View of 4× Side-Straddling Blades (Box-Portal Rigidity) + Exact Millimeter Sand Clearance (230 mm Tunnel Height)</text>
  <rect x="24" y="68" width="484" height="468" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Front View — 4× Side-Straddling Blades (Deployed)</text>
  <text x="42" y="109" class="ok">Direct rail-to-pod mount • Upper Wing box-portal tie (&lt;3 mm roll flex!)</text>
  <rect x="34" y="302" width="464" height="222" rx="6" fill="url(#water)"/>
  <line x1="34" y1="302" x2="498" y2="302" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="6,3"/>
  <text x="488" y="296" text-anchor="end" class="dim">Cruise Waterline (6"–8" Clear!)</text>
  <circle cx="121" cy="205" r="55" fill="url(#tubeGrad)" stroke="#475569" stroke-width="1.8"/>
  <circle cx="411" cy="205" r="55" fill="url(#tubeGrad)" stroke="#475569" stroke-width="1.8"/>
  <text x="121" y="209" text-anchor="middle" class="lbl-sm">Ø460 mm</text>
  <text x="411" y="209" text-anchor="middle" class="lbl-sm">Ø460 mm</text>
  <line x1="176" y1="205" x2="356" y2="205" stroke="#64748B" stroke-width="3.5"/>
  <rect x="170" y="193" width="192" height="10" rx="2" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.2"/>
  <text x="266" y="187" text-anchor="middle" class="lbl">Drop-In Rigid Spine Floor</text>
  <rect x="228" y="208" width="12" height="7" rx="1.5" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="231" y="215" width="6" height="185" fill="url(#carbon)" stroke="#0F172A" stroke-width="1"/>
  <rect x="292" y="208" width="12" height="7" rx="1.5" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="295" y="215" width="6" height="185" fill="url(#carbon)" stroke="#0F172A" stroke-width="1"/>
  <rect x="141" y="271" width="250" height="10" rx="5" fill="url(#wingTeal)" stroke="#0F766E" stroke-width="1.4"/>
  <text x="394" y="266" text-anchor="end" class="ok">Upper Step-Out Wing (In AIR &gt;9 kn!)</text>
  <rect x="106" y="397" width="320" height="7" rx="3.5" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.3"/>
  <rect x="236" y="388" width="60" height="24" rx="10" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.6"/>
  <text x="266" y="404" text-anchor="middle" class="lbl-w">26 L</text>
  <text x="266" y="432" text-anchor="middle" class="lbl">220×80 mm Battery-Fuselage + 1,350 cm² Lower Thin Wings</text>
  <line x1="234.0" y1="229.0" x2="298.0" y2="229.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="266.0" y="223.0" text-anchor="middle" class="dim">250 mm</text>
  <line x1="76.0" y1="302.0" x2="76.0" y2="400.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="100.0" y="355.0" text-anchor="middle" class="dim">400 mm</text>
  <rect x="532" y="68" width="484" height="468" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="550" y="92" class="sec">B. Folded Stack-Up Comparison (85° Aft Fold vs. Flat Sand)</text>
  <text x="550" y="109" class="lbl-sm">Navigator 300 (600 mm tunnel): ~230 mm web to Ø460 tube bottom</text>
  <text x="550" y="131" class="lbl">Primary A: 4× Side-Straddling Blades (60×9 mm)</text>
  <rect x="550" y="135" width="446" height="6" fill="#64748B"/>
  <rect x="550" y="236.2" width="446" height="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <text x="990" y="244.2" text-anchor="end" style="font-size:8.5px;fill:#92400E;font-weight:700;">Flat Beach / Bottom of Ø460 Tubes (-230 mm)</text>
  <rect x="605" y="139.4" width="210" height="35.2" rx="8" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="585" y="143.0" width="185" height="26.4" rx="4" fill="url(#wingBlue)" fill-opacity="0.72" stroke="#0369A1" stroke-width="1.3"/>
  <text x="710" y="161.0" text-anchor="middle" class="lbl-w">80 mm Pod (60 mm Blades Beside)</text>
  <line x1="855.0" y1="174.6" x2="855.0" y2="236.2" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="889.0" y="209.4" text-anchor="middle" class="ok">+140 mm</text>
  <text x="556" y="259.2" class="ok">90 mm deep → +140 mm (5.5") CLEAR ABOVE SAND!</text>
  <text x="992" y="159.0" text-anchor="end" class="lbl-sm">Blades flank pod sides</text>
  <text x="550" y="276" class="lbl">Primary B: 2× Recessed Center Struts (100×18 mm)</text>
  <rect x="550" y="280" width="446" height="6" fill="#64748B"/>
  <rect x="550" y="381.2" width="446" height="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <text x="990" y="389.2" text-anchor="end" style="font-size:8.5px;fill:#92400E;font-weight:700;">Flat Beach / Bottom of Ø460 Tubes (-230 mm)</text>
  <rect x="605" y="304.2" width="210" height="35.2" rx="8" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="585" y="288.0" width="190" height="44.0" rx="4" fill="url(#wingBlue)" fill-opacity="0.62" stroke="#0369A1" stroke-width="1.3" stroke-dasharray="4,2"/>
  <text x="710" y="331.4" text-anchor="middle" class="lbl-w">80 mm Pod (55 mm Top Recess)</text>
  <line x1="855.0" y1="339.4" x2="855.0" y2="381.2" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="889.0" y="364.3" text-anchor="middle" class="dim">+95 mm</text>
  <text x="556" y="404.2" class="dim">135 mm deep → +95 mm (3.7") clear above sand</text>
  <text x="992" y="304.0" text-anchor="end" class="lbl-sm">55 mm top-slot overlap</text>
  <text x="550" y="421" class="lbl">Avoid — Naive Stack: 120 mm Strut ON TOP of Pod</text>
  <rect x="550" y="425" width="446" height="6" fill="#64748B"/>
  <rect x="550" y="526.2" width="446" height="10" fill="#FDE68A" stroke="#D97706" stroke-width="1"/>
  <text x="990" y="534.2" text-anchor="end" style="font-size:8.5px;fill:#92400E;font-weight:700;">Flat Beach / Bottom of Ø460 Tubes (-230 mm)</text>
  <rect x="585" y="433.0" width="190" height="52.8" rx="4" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.3"/>
  <text x="680" y="462.4" text-anchor="middle" class="warn">120 mm Strut Chord Vertical</text>
  <rect x="605" y="482.2" width="210" height="35.2" rx="8" fill="url(#carbon)" stroke="#DC2626" stroke-width="1.6"/>
  <text x="710" y="503.8" text-anchor="middle" class="lbl-w">80 mm Pod Below Strut</text>
  <line x1="855.0" y1="517.4" x2="855.0" y2="526.2" stroke="#DC2626" stroke-width="1.2" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="889.0" y="515.8" text-anchor="middle" class="warn">+20 mm</text>
  <text x="556" y="549.2" class="warn">210 mm deep → ONLY +20 mm (0.8") — hits pebbles!</text>
  <text x="992" y="449.0" text-anchor="end" class="lbl-sm">120+10+80 mm stack</text>
</svg>
