  <line x1="780" y1="173" x2="714" y2="200" stroke="#DC2626" stroke-width="1.1" marker-end="url(#arrRed)"/>
  <text x="585" y="344" text-anchor="middle" class="warn">Passive Seawater Cooling (&lt;45°C MOSFETs)</text>
  <text x="895" y="330" text-anchor="middle" class="ok">CNC Double-O-Ring Door</text>
  <text x="895" y="344" text-anchor="middle" class="lbl-sm">Slide cartridges out aft</text>
  <line x1="825" y1="322" x2="758" y2="292" stroke="#059669" stroke-width="1.1" marker-end="url(#arrGreen)"/>
  <text x="42" y="408" class="ok">Free Archimedes Lift (~26.6 kg Buoyancy): Cancels ~90% of 30 kg battery weight underwater with ZERO induced drag!</text>
  <text x="42" y="428" class="lbl-sm">Serviceability: Run 1 cartridge + closed-cell foam dummy plug (~15 nm solo) or 2 cartridges (~31 nm 2-up); replace single pack if worn.</text>
  <text x="42" y="446" class="lbl-sm">Impact Protection: 20 mm Kevlar/elastomer cone + 5 mm G10 bulkhead isolate cells from 15 kn debris/shoal strikes.</text>
