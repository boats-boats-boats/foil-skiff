<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="718" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1056" height="652" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">22. True 90° Upper &amp; Lower Fold Channels, Dyneema Pulley Loop &amp; Flaperon Dog-Clutch</text>
  <text x="24" y="46" class="sub">220 mm Total Folded Width (Fits Between 250 mm Rails!) • 100% Intact 26 L Dry Battery Bay • Zero Underwater Sweep Motors!</text>
  <rect x="24" y="68" width="510" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Front Cross-Section: Upper (13 mm) &amp; Lower (12 mm) Channels</text>
  <text x="42" y="109" class="ok">2×102 mm Main Wing + 2×105 mm Roof Blades nest 90° flush inside 220 mm!</text>
  <rect x="96" y="146" width="360" height="156" rx="34" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.4"/>
  <rect x="120" y="146" width="312" height="22" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/>
  <rect x="128" y="150" width="140" height="14" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <rect x="284" y="150" width="140" height="14" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <text x="276" y="136" text-anchor="middle" class="ok">Upper Fold Channel (13 mm): Switchblade OR Staggerwing (210 mm)</text>
  <rect x="140" y="180" width="272" height="86" rx="8" fill="#10B981" fill-opacity="0.22" stroke="#059669" stroke-width="1.6"/>
  <text x="276" y="218" text-anchor="middle" class="sec">100% Intact 26 L Dry IP68 Battery Bay</text>
  <text x="276" y="236" text-anchor="middle" class="lbl-sm">(2× Swappable 14 kg Cartridges + VESCs + IMU — ZERO intrusion!)</text>
  <rect x="120" y="278" width="312" height="24" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <rect x="128" y="278" width="296" height="4" fill="#F97316"/>
  <rect x="128" y="298" width="296" height="4" fill="#F97316"/>
  <rect x="130" y="283" width="136" height="14" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.2"/>
  <rect x="286" y="283" width="136" height="14" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.2"/>
  <rect x="184" y="274" width="10" height="32" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  <rect x="358" y="274" width="10" height="32" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  <rect x="264" y="284" width="24" height="12" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.1"/>
  <text x="276" y="322" text-anchor="middle" class="warn">Lower Fold Channel (12 mm): Main Wing 2×102 mm (Pivots @ y = ±54 mm)</text>
  <text x="42" y="346" class="ok">40 mm Inboard Overhang Roots: Carry 100% lift/roll in compression (~35 MPa, &gt;10×!).</text>
  <text x="42" y="366" class="lbl-sm">Zero Side-Wall Cutouts: Unlike hollowing the pod sides, top/bottom channels keep 100% dry bay!</text>
  <text x="42" y="384" class="dim">Total Pod Height: ~95–105 mm (vs 80 mm fixed) • Zero external hubs = ~0 lbf extra drag!</text>
  <rect x="550" y="68" width="506" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="568" y="92" class="sec">B. Closed-Loop Dyneema Pulley Deploy/Fold (Zero Sweep Motors!)</text>
  <text x="568" y="109" class="dim">Ø2.5 mm SK78 Dyneema (2:1 pulley = &lt;8 kgf pull) • Coaxial over strut hinge axles!</text>
  <rect x="562" y="118" width="482" height="196" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="576" y="132" width="124" height="62" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.4"/>
  <text x="638" y="148" text-anchor="middle" class="dim">Dry Cockpit Loop</text>
  <rect x="586" y="156" width="48" height="22" rx="4" fill="#10B981" stroke="#065F46" stroke-width="1.2"/>
  <text x="610" y="170" text-anchor="middle" style="font-size:8px;fill:#FFFFFF;font-weight:700;">DEPLOY</text>
  <rect x="642" y="156" width="48" height="22" rx="4" fill="#F97316" stroke="#9A3412" stroke-width="1.2"/>
  <text x="666" y="170" text-anchor="middle" style="font-size:8px;fill:#FFFFFF;font-weight:700;">FOLD</text>
  <rect x="742" y="136" width="22" height="114" rx="4" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <circle cx="753" cy="146" r="8" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <circle cx="753" cy="240" r="8" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <text x="753" y="129" text-anchor="middle" class="lbl-sm">Coaxial Pulleys</text>
  <path d="M 610 178 L 610 212 L 748 146 L 748 240 L 844 252" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <path d="M 666 178 L 666 226 L 758 146 L 758 240 L 944 252" fill="none" stroke="#F97316" stroke-width="2.2" stroke-dasharray="5,2" marker-end="url(#arrRed)"/>
  <rect x="814" y="196" width="218" height="106" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <text x="923" y="212" text-anchor="middle" class="warn">Belly Channel Gear + Pulley Drum</text>
  <circle cx="876" cy="248" r="18" fill="url(#alu)" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="912" cy="248" r="18" fill="url(#alu)" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="876" cy="248" r="5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.1"/>
  <circle cx="912" cy="248" r="5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.1"/>
  <rect x="952" y="232" width="66" height="32" rx="4" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.2"/>
  <text x="985" y="246" text-anchor="middle" style="font-size:8px;fill:#FFFFFF;font-weight:700;">IP68 Servo</text>
  <text x="985" y="257" text-anchor="middle" style="font-size:7.4px;fill:#FEE2E2;">0%–100% Pin</text>
  <text x="894" y="288" text-anchor="middle" class="ok">Green = Deploy 90°→0° • Orange = Fold 0°→90°</text>
  <text x="568" y="334" class="ok">1. Constant Line Length: Coaxial hinge pulleys eliminate slack/binding on 86.5° fold!</text>
  <text x="568" y="352" class="lbl-sm">2. Sand &amp; Saltwater Proof: Ø2.5 mm SK78 Dyneema (700 kg!) + open Delrin sheaves.</text>
  <text x="568" y="370" class="dim">3. Zero Underwater Sweep Motors: All pulling effort is dry &amp; manual (&lt;8 kgf, 2 s!).</text>
  <text x="568" y="388" class="lbl-sm">4. Rear 90° Spring Detent clicks wings locked flat inside channel for beaching!</text>
  <rect x="24" y="414" width="1032" height="284" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="438" class="sec">C. Active Flaperon 90° Fold: Spring-Loaded Bevel Dog-Clutch Knuckle (Zero Bevel Gears!)</text>
  <text x="42" y="455" class="ok">Zero-play ±15° / ±3° active pitch when deployed — disengages cleanly &amp; self-feathers 0° to tuck 90° flush in roof channel!</text>
  <rect x="38" y="468" width="484" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="486" class="ok">C1. Deployed (0° Flight): Male V-Key Engaged in Ø8 mm Servo Cup</text>
  <rect x="64" y="510" width="84" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <text x="106" y="530" text-anchor="middle" class="lbl-sm">Sealed Pod</text>
  <rect x="74" y="554" width="52" height="44" rx="4" fill="#FBBF24" stroke="#92400E" stroke-width="1.3"/>
  <text x="100" y="580" text-anchor="middle" style="font-size:8.2px;fill:#0F172A;font-weight:700;">IP68 Servo</text>
  <rect x="142" y="558" width="14" height="36" rx="2" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <rect x="126" y="571" width="72" height="10" fill="#DC2626"/>
  <polygon points="196,562 222,562 208,576 222,590 196,590" fill="#475569" stroke="#0F172A" stroke-width="1.3"/>
  <polygon points="212,576 228,565 262,565 262,587 228,587" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <rect x="262" y="556" width="218" height="54" rx="6" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.5"/>
  <text x="370" y="580" text-anchor="middle" style="font-size:10px;fill:#FFFFFF;font-weight:700;">Active Flaperon (20%-Chord Pitch)</text>
  <text x="370" y="595" text-anchor="middle" style="font-size:8.5px;fill:#E0F2FE;">Zero-play ±15° STOL / ±3° roll control!</text>
  <circle cx="236" cy="604" r="6" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <text x="236" y="630" text-anchor="middle" class="ok">Ø10 mm Vertical TE Sweep Pin</text>
  <text x="220" y="546" text-anchor="middle" class="warn">Bevel V-Dog-Clutch</text>
  <text x="50" y="670" class="lbl-sm">Internal pod O-ring seal NEVER moves — clutch lives outside the watertight wall!</text>
  <rect x="546" y="468" width="494" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="558" y="486" class="warn">C2. Folded 90° Straight Aft: Disengaged &amp; Self-Feathered 0° in Roof Channel!</text>
  <rect x="572" y="510" width="72" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <rect x="638" y="558" width="12" height="36" rx="2" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <rect x="626" y="571" width="54" height="10" fill="#DC2626"/>
  <polygon points="676,562 698,562 686,576 698,590 676,590" fill="#475569" stroke="#0F172A" stroke-width="1.3"/>
  <circle cx="712" cy="600" r="6" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <rect x="700" y="600" width="38" height="62" rx="5" fill="#F97316" stroke="#9A3412" stroke-width="1.5"/>
  <path d="M 738 570 Q 768 588 748 624" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="784" y="528" class="ok">1. Zero Servo Gear Stripping:</text>
  <text x="794" y="542" class="lbl-sm">Pivoting 90° pulls V-key right out of</text>
  <text x="794" y="555" class="lbl-sm">the servo cup — servo stays isolated!</text>
  <text x="784" y="578" class="dim">2. Automatic 0° Self-Feathering:</text>
  <text x="794" y="592" class="lbl-sm">20%-chord balance lets water pressure</text>
  <text x="794" y="605" class="lbl-sm">flatten the blade to 0° instantly!</text>
  <text x="784" y="628" class="ok">3. Auto Re-Engagement on Reset:</text>
  <text x="794" y="642" class="lbl-sm">Pull Dyneema Deploy → bevel V-key</text>
  <text x="794" y="655" class="lbl-sm">self-centers cleanly into servo cup!</text>
</svg>
