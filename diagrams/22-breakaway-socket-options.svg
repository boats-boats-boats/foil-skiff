<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="718" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1056" height="652" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">22. Central Breakaway Wing Socket: V-Cradle Sandwich Anatomy &amp; Alternative Mechanisms</text>
  <text x="24" y="46" class="sub">Detailed Double-Shear Bushing Mechanics (Option 1) vs. Ski-Binding Cam (Opt 2), DIY Front C-Hook (Opt 3) &amp; Kingpin Swing (Opt 4)</text>
  <rect x="24" y="68" width="510" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Option 1: 120° V-Cradle Stack-Up &amp; Double-Shear Rule</text>
  <text x="42" y="109" class="ok">~22 mm total thickness • UHMW flanges take 100% lift/roll • Pin sees ONLY +X shear</text>
  <rect x="36" y="118" width="486" height="148" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="46" y="134" class="dim">A1. Side Cross-Section Through Corner Pin (y = ±95 mm)</text>
  <rect x="74" y="144" width="320" height="12" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1.2"/>
  <text x="234" y="153" text-anchor="middle" style="font-size:8px;fill:#FFFFFF;font-weight:700;">Pod Belly &amp; Twin 6 mm G10/Carbon Internal Bulkheads</text>
  <rect x="86" y="156" width="296" height="14" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="86" y="170" width="56" height="44" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <text x="114" y="190" text-anchor="middle" style="font-size:8px;fill:#78350F;font-weight:700;">120° V</text>
  <text x="114" y="201" text-anchor="middle" style="font-size:7.5px;fill:#78350F;">Stop</text>
  <rect x="142" y="170" width="240" height="6" fill="#F97316"/>
  <rect x="142" y="208" width="240" height="6" fill="#F97316"/>
  <rect x="144" y="176" width="232" height="32" rx="2" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <text x="228" y="195" text-anchor="middle" style="font-size:8.8px;fill:#FFFFFF;font-weight:700;">Wing V-Foot Carrier Block (14 mm)</text>
  <polygon points="86,214 382,214 396,226 382,232 86,228" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="326" y="156" width="20" height="14" fill="#475569" stroke="#0F172A" stroke-width="1"/>
  <rect x="326" y="176" width="20" height="32" fill="#475569" stroke="#0F172A" stroke-width="1"/>
  <rect x="326" y="214" width="20" height="15" fill="#475569" stroke="#0F172A" stroke-width="1"/>
  <rect x="331" y="154" width="10" height="79" rx="2" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.2"/>
  <circle cx="172" cy="163" r="4" fill="#059669" stroke="#064E3B" stroke-width="1"/>
  <line x1="382" y1="192" x2="438" y2="192" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="444" y="188" class="ok">OPEN REAR</text>
  <text x="444" y="200" class="lbl-sm">(+X Shear!)</text>
  <text x="172" y="248" text-anchor="middle" class="lbl-sm">Orange = 1.5 mm UHMW strips (μ≈0.07)</text>
  <text x="396" y="248" text-anchor="middle" class="warn">↑ Ø6 mm Delrin Pin + 316 SS Sleeves</text>
  <rect x="36" y="274" width="236" height="114" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.1"/>
  <text x="46" y="290" class="ok">GOOD: Flush Double Shear (&lt;0.3 mm)</text>
  <rect x="64" y="302" width="66" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="78" y="317" width="66" height="18" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1"/>
  <rect x="64" y="336" width="66" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="98" y="300" width="9" height="52" rx="1.5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1"/>
  <line x1="146" y1="326" x2="174" y2="326" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="180" y="321" class="ok">Clean Snap</text>
  <text x="180" y="334" class="lbl-sm">±10% load!</text>
  <text x="46" y="374" class="lbl-sm">2 sharp SS faces slice pin cleanly.</text>
  <rect x="286" y="274" width="236" height="114" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.1"/>
  <text x="296" y="290" class="warn">BAD: Wide Gap (Bends &amp; Jams!)</text>
  <rect x="310" y="302" width="60" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="332" y="334" width="60" height="16" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1"/>
  <path d="M 342 300 L 342 316 L 356 334 L 356 352" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <text x="410" y="324" class="warn">Pin bends</text>
  <text x="410" y="337" class="lbl-sm">&amp; wedges!</text>
  <text x="296" y="374" class="lbl-sm">Never leave gaps or use Nylon/HDPE!</text>
  <rect x="550" y="68" width="506" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="568" y="92" class="sec">B. Detaching Alternatives: Option 2 (Cam) &amp; Option 3 (DIY Hook)</text>
  <text x="568" y="109" class="dim">Both keep halves coupled on 0.35 m leash • Compare reset speed vs. build ease</text>
  <rect x="562" y="118" width="482" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="574" y="135" class="dim">Option 2: Spring-Loaded "Ski-Binding" Cam (Zero Spare Pins!)</text>
  <path d="M 630 190 L 688 154 L 702 154 L 650 190 L 702 226 L 688 226 Z" fill="#FBBF24" stroke="#78350F" stroke-width="1.4"/>
  <path d="M 654 190 L 696 162 L 720 162 L 720 218 L 696 218 Z" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <circle cx="710" cy="164" r="5.5" fill="#475569" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="710" y1="158" x2="710" y2="144" stroke="#DC2626" stroke-width="3" stroke-dasharray="3,2"/>
  <circle cx="710" cy="216" r="5.5" fill="#475569" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="710" y1="222" x2="710" y2="236" stroke="#DC2626" stroke-width="3" stroke-dasharray="3,2"/>
  <line x1="726" y1="190" x2="766" y2="190" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="794" y="160" class="ok">Pro: 10-second click-back reset!</text>
  <text x="802" y="174" class="lbl-sm">Belleville/coil springs pop open @ ~70 kgf</text>
  <text x="802" y="187" class="lbl-sm">and snap shut when pushed back in.</text>
  <text x="794" y="208" class="warn">Con: +0.5 kg, ~38 mm thick, ~$200</text>
  <text x="802" y="222" class="lbl-sm">Fine beach sand in spring bores can</text>
  <text x="802" y="235" class="lbl-sm">shift release force unless rinsed well.</text>
  <rect x="562" y="258" width="482" height="130" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="574" y="275" class="ok">Option 3: Front C-Hook + 2× Rear Shear Bolts (Easiest Garage DIY!)</text>
  <rect x="588" y="294" width="176" height="14" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <path d="M 588 308 L 622 308 L 622 326 L 606 326 L 606 318 L 614 318 L 614 314 L 588 314 Z" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <rect x="610" y="310" width="142" height="14" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <rect x="728" y="292" width="8" height="38" rx="1.5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1.1"/>
  <path d="M 690 330 L 748 354" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="638" y="352" text-anchor="middle" class="lbl-sm">Front C-Lip</text>
  <text x="732" y="376" text-anchor="middle" class="ok">25° Steep Drop-Exit!</text>
  <text x="794" y="302" class="ok">Pro: ZERO CNC pocket • 16 mm slim!</text>
  <text x="802" y="316" class="lbl-sm">Flat plates + simple front hook; sand</text>
  <text x="802" y="329" class="lbl-sm">cannot jam an open-bottom hook!</text>
  <text x="794" y="350" class="warn">Con: Needs rear SS shear sleeves</text>
  <text x="802" y="364" class="lbl-sm">so rear pins shear cleanly (±10%),</text>
  <text x="802" y="377" class="lbl-sm">not unpredictable tension break (±30%).</text>
  <rect x="24" y="414" width="1032" height="284" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="438" class="sec">C. Option 4: Central Ø20 mm Kingpin "Weathervane" Swing (Never Detaches!) &amp; 5-Option Summary</text>
  <text x="42" y="455" class="ok">Zero leash &amp; zero prop risk (stops 150 mm ahead of prop!) — pair ONLY with Fixed Upper Staggerwing or Roof Switchblade!</text>
  <rect x="38" y="468" width="496" height="216" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="485" class="dim">Option 4 Top-Down: 0° Cruise → 82° Oblique Scissors Swing on Tip Hit</text>
  <rect x="118" y="560" width="270" height="32" rx="16" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="402" y1="552" x2="402" y2="600" stroke="#0284C7" stroke-width="4.2" stroke-linecap="round"/>
  <text x="412" y="580" class="dim">Prop</text>
  <text x="412" y="592" class="ok">(150 mm</text>
  <text x="412" y="603" class="ok">clear!)</text>
  <circle cx="208" cy="576" r="24" fill="#F97316" fill-opacity="0.35" stroke="#9A3412" stroke-width="1.6"/>
  <rect x="199" y="494" width="18" height="164" rx="5" fill="url(#wingBlue)" fill-opacity="0.26" stroke="#0369A1" stroke-width="1.3" stroke-dasharray="4,2"/>
  <polygon points="128,552 290,582 286,598 124,568" fill="#F97316" fill-opacity="0.88" stroke="#9A3412" stroke-width="1.5"/>
  <circle cx="208" cy="576" r="6.2" fill="#FBBF24" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="232" cy="576" r="3.8" fill="#DC2626" stroke="#0F172A" stroke-width="1.1"/>
  <path d="M 196 502 Q 150 512 136 550" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <path d="M 220 650 Q 266 640 282 602" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="152" y1="644" x2="192" y2="644" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arrRed)"/>
  <text x="146" y="641" text-anchor="end" class="warn">Tip Hit</text>
  <text x="146" y="653" text-anchor="end" class="lbl-sm">(~70 kgf)</text>
  <text x="114" y="532" text-anchor="middle" class="lbl-sm">Port swings</text>
  <text x="114" y="544" text-anchor="middle" class="lbl-sm">under nose</text>
  <text x="314" y="528" text-anchor="middle" class="ok">Ø20 mm Kingpin</text>
  <text x="314" y="540" text-anchor="middle" class="lbl-sm">+ Ø180 mm Turntable</text>
  <text x="50" y="672" style="font-size:9.3px;fill:#DC2626;font-weight:700;">Catch: +0.5 kg turntable; hits DOWN flaps (pair w/ Fixed UP Staggerwing!).</text>
  <rect x="550" y="468" width="490" height="216" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="566" y="490" class="sec">Quick Pick Guide: All 5 Central-Socket Options</text>
  <text x="566" y="514" class="ok">1. 120° V-Cradle + 2× Ø6 Pins</text>
  <text x="764" y="514" class="lbl-sm">Best overall (±10% snap, 22 mm slim, CNC)</text>
  <line x1="564" y1="522" x2="1026" y2="522" stroke="#E2E8F0" stroke-width="1"/>
  <text x="566" y="545" class="dim">2. Ski-Binding Spring Cam</text>
  <text x="764" y="545" class="lbl-sm">10 s click reset (0 pins), thicker (38 mm)</text>
  <line x1="564" y1="553" x2="1026" y2="553" stroke="#E2E8F0" stroke-width="1"/>
  <text x="566" y="576" class="ok">3. Front C-Hook + 2× Rear Pins</text>
  <text x="764" y="576" class="lbl-sm">Easiest garage DIY (16 mm, zero sand jam)</text>
  <line x1="564" y1="584" x2="1026" y2="584" stroke="#E2E8F0" stroke-width="1"/>
  <text x="566" y="607" class="dim">4. Ø20 Kingpin Weathervane</text>
  <text x="764" y="607" class="lbl-sm">Never detaches! Best w/ Fixed UP Staggerwing</text>
  <line x1="564" y1="615" x2="1026" y2="615" stroke="#E2E8F0" stroke-width="1"/>
  <text x="566" y="638" class="warn">5. Fixed Solid 4× M8 Bolts</text>
  <text x="764" y="638" class="lbl-sm">Simplest/lightest (carbon tip is $400 fuse)</text>
  <line x1="564" y1="646" x2="1026" y2="646" stroke="#E2E8F0" stroke-width="1"/>
  <text x="566" y="672" class="lbl-sm">All Options 1–4 release BOTH wing halves symmetrically → boat settles flat!</text>
</svg>
