<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="718" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1056" height="652" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">22. Unified Linked-Fold Mechanics: Overhang Bridge, Root Gears &amp; Flaperon Dog-Clutch</text>
  <text x="24" y="46" class="sub">One Mechanism Solves Impact Relief, 600 mm Tunnel Beaching &amp; Storage — Zero Detaching Leash, Zero Outer Wingtip Hinges!</text>
  <rect x="24" y="68" width="510" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. 22 mm Overhang C-Slot Bridge &amp; Double-Shear Pin Rule</text>
  <text x="42" y="109" class="ok">72 mm inboard root takes 100% lift/roll in compression — pivots see ZERO bending!</text>
  <rect x="36" y="118" width="486" height="148" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="46" y="134" class="dim">A1. Front Cross-Section Through Root Pivots (y = ±92 mm) &amp; Central Gear Mesh</text>
  <rect x="64" y="144" width="424" height="12" rx="2" fill="#10B981" stroke="#065F46" stroke-width="1.2"/>
  <text x="276" y="153" text-anchor="middle" style="font-size:8px;fill:#FFFFFF;font-weight:700;">Pod Belly &amp; Twin 6 mm G10/Carbon Internal Bulkheads (Zero Battery Intrusion!)</text>
  <rect x="92" y="156" width="368" height="12" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="112" y="168" width="328" height="5" fill="#F97316"/>
  <rect x="112" y="207" width="328" height="5" fill="#F97316"/>
  <rect x="46" y="173" width="212" height="34" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <rect x="294" y="173" width="212" height="34" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <rect x="256" y="177" width="40" height="26" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.3"/>
  <text x="276" y="193" text-anchor="middle" style="font-size:7.8px;fill:#0F172A;font-weight:700;">Gears</text>
  <rect x="92" y="212" width="368" height="12" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
  <rect x="126" y="154" width="12" height="72" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <rect x="414" y="154" width="12" height="72" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <line x1="66" y1="234" x2="66" y2="212" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <line x1="486" y1="234" x2="486" y2="212" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="66" y="248" text-anchor="middle" class="dim">+Lift</text>
  <text x="486" y="248" text-anchor="middle" class="dim">+Lift</text>
  <text x="276" y="248" text-anchor="middle" class="ok">72 mm Inboard Roots React 100% Bending in Compression (0 Pivot Load!)</text>
  <rect x="36" y="274" width="236" height="114" rx="6" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.1"/>
  <text x="46" y="290" class="ok">GOOD: Flush Double Shear (&lt;0.3 mm)</text>
  <rect x="64" y="302" width="66" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="78" y="317" width="66" height="18" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1"/>
  <rect x="64" y="336" width="66" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="98" y="300" width="9" height="52" rx="1.5" fill="#DC2626" stroke="#7F1D1D" stroke-width="1"/>
  <line x1="146" y1="326" x2="174" y2="326" stroke="#059669" stroke-width="2.2" marker-end="url(#arrGreen)"/>
  <text x="180" y="321" class="ok">Clean Snap</text>
  <text x="180" y="334" class="lbl-sm">±10% load!</text>
  <text x="46" y="374" class="lbl-sm">316 SS sleeves slice Ø8 Delrin cleanly.</text>
  <rect x="286" y="274" width="236" height="114" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.1"/>
  <text x="296" y="290" class="warn">BAD: Wide Gap (Bends &amp; Jams!)</text>
  <rect x="310" y="302" width="60" height="14" fill="url(#alu)" stroke="#334155" stroke-width="1"/>
  <rect x="332" y="334" width="60" height="16" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1"/>
  <path d="M 342 300 L 342 316 L 356 334 L 356 352" fill="none" stroke="#DC2626" stroke-width="7" stroke-linecap="round"/>
  <text x="410" y="324" class="warn">Pin bends</text>
  <text x="410" y="337" class="lbl-sm">&amp; wedges!</text>
  <text x="296" y="374" class="lbl-sm">Never leave gaps or use Nylon/HDPE!</text>
  <rect x="550" y="68" width="506" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="568" y="92" class="sec">B. Synchronized Root Gear Mesh &amp; Single Fuse Pin (Top View)</text>
  <text x="568" y="109" class="dim">1× Ø8 mm Delrin pin locks BOTH halves • Pull lanyard for 5-sec beach fold!</text>
  <rect x="562" y="118" width="482" height="184" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="616" y="142" width="144" height="140" rx="14" fill="#E2E8F0" stroke="#475569" stroke-width="1.5"/>
  <rect x="626" y="154" width="12" height="116" rx="2" fill="#334155"/>
  <rect x="640" y="128" width="44" height="62" rx="4" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <rect x="640" y="234" width="44" height="62" rx="4" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.4"/>
  <circle cx="664" cy="194" r="18" fill="url(#alu)" stroke="#0F172A" stroke-width="1.6" stroke-dasharray="4,2"/>
  <circle cx="664" cy="230" r="18" fill="url(#alu)" stroke="#0F172A" stroke-width="1.6" stroke-dasharray="4,2"/>
  <circle cx="664" cy="162" r="6.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="664" cy="262" r="6.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.5"/>
  <rect x="682" y="202" width="58" height="20" rx="4" fill="#475569" stroke="#0F172A" stroke-width="1.3"/>
  <circle cx="722" cy="212" r="6.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.4"/>
  <line x1="730" y1="212" x2="786" y2="212" stroke="#059669" stroke-width="2.2" stroke-dasharray="4,2" marker-end="url(#arrGreen)"/>
  <rect x="754" y="168" width="6" height="16" fill="#0284C7"/>
  <rect x="754" y="240" width="6" height="16" fill="#0284C7"/>
  <text x="800" y="148" class="ok">1. Twin Ø16 mm Vertical Pivots</text>
  <text x="810" y="161" class="lbl-sm">at y = ±92 mm (carry sweep only!)</text>
  <text x="800" y="182" class="dim">2. 90° 316 SS Gear Sectors</text>
  <text x="810" y="195" class="lbl-sm">6–8 teeth mesh at y = 0 (symmetric!)</text>
  <text x="800" y="216" class="warn">3. 1× Central Ø8 mm Delrin Pin</text>
  <text x="810" y="229" class="lbl-sm">~85 kgf tip / ~170 kgf center shoal</text>
  <text x="800" y="250" class="ok">4. Pull Lanyard + 3 mm Drain Slots</text>
  <text x="810" y="263" class="lbl-sm">Manual beach fold + sand flush-out</text>
  <text x="572" y="136" class="lbl-sm">← BOW</text>
  <text x="568" y="324" class="ok">Reset on Water (&lt;30 s): Swing wings forward to 0°, drop 1× $0.35 Delrin pin!</text>
  <text x="568" y="344" class="lbl-sm">Smart Divider: Center hit (~140 kgf) trips struts first; tip hit (~85 kgf) sweeps wings.</text>
  <text x="568" y="364" class="dim">Hardware Delta: +0.5–0.7 kg, ~$180–$260 CNC — replaces ALL separate tip hinges/leashes!</text>
  <text x="568" y="384" class="lbl-sm">Zero-Fold Simple Alt: Fixed 4× M8 bolted wing (deep rock-free water only).</text>
  <rect x="24" y="414" width="1032" height="284" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="438" class="sec">C. Active Flaperon Linked-Fold: Spring-Loaded Bevel Dog-Clutch Knuckle (Zero Bevel Gears!)</text>
  <text x="42" y="455" class="ok">Delivers zero-play ±15° / ±3° active pitch when deployed — disengages cleanly &amp; self-feathers 0° on 82° aft fold!</text>
  <rect x="38" y="468" width="484" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="486" class="ok">C1. Deployed (0° Flight): Male V-Key Engaged in Ø8 mm Servo Cup</text>
  <rect x="64" y="510" width="84" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <text x="106" y="530" text-anchor="middle" class="lbl-sm">Sealed Pod</text>
  <rect x="74" y="554" width="52" height="44" rx="4" fill="#FBBF24" stroke="#92400E" stroke-width="1.3"/>
  <text x="100" y="580" text-anchor="middle" style="font-size:8.2px;fill:#0F172A;font-weight:700;">IP68 Servo</text>
  <rect x="142" y="558" width="14" height="36" rx="2" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <rect x="126" y="571" width="72" height="10" fill="#DC2626"/>
  <polygon points="196,562 222,562 208,576 222,590 196,590" fill="#475569" stroke="#0F172A" stroke-width="1.3"/>
  <polygon points="212,576 228,565 262,565 262,587 228,587" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <rect x="262" y="556" width="218" height="54" rx="6" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.5"/>
  <text x="370" y="580" text-anchor="middle" style="font-size:10px;fill:#FFFFFF;font-weight:700;">Active Flaperon (20%-Chord Pitch)</text>
  <text x="370" y="595" text-anchor="middle" style="font-size:8.5px;fill:#E0F2FE;">Zero-play ±15° STOL / ±3° roll control!</text>
  <circle cx="236" cy="604" r="6" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <text x="236" y="630" text-anchor="middle" class="ok">Ø10 mm Vertical TE Sweep Pin</text>
  <text x="220" y="546" text-anchor="middle" class="warn">Bevel V-Dog-Clutch</text>
  <text x="50" y="670" class="lbl-sm">Internal pod O-ring seal NEVER moves — clutch lives outside the watertight wall!</text>
  <rect x="546" y="468" width="494" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="558" y="486" class="warn">C2. Swept 82° Aft (Impact OR Beaching): Disengaged &amp; Self-Feathered 0°!</text>
  <rect x="572" y="510" width="72" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <rect x="638" y="558" width="12" height="36" rx="2" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <rect x="626" y="571" width="54" height="10" fill="#DC2626"/>
  <polygon points="676,562 698,562 686,576 698,590 676,590" fill="#475569" stroke="#0F172A" stroke-width="1.3"/>
  <circle cx="712" cy="600" r="6" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <rect x="700" y="600" width="38" height="62" rx="5" fill="#F97316" stroke="#9A3412" stroke-width="1.5"/>
  <path d="M 738 570 Q 768 588 748 624" fill="none" stroke="#059669" stroke-width="2.4" marker-end="url(#arrGreen)"/>
  <text x="784" y="528" class="ok">1. Zero Servo Gear Stripping:</text>
  <text x="794" y="542" class="lbl-sm">Pivoting aft pulls V-key right out of</text>
  <text x="794" y="555" class="lbl-sm">the servo cup — servo stays isolated!</text>
  <text x="784" y="578" class="dim">2. Automatic 0° Self-Feathering:</text>
  <text x="794" y="592" class="lbl-sm">20%-chord balance lets water pressure</text>
  <text x="794" y="605" class="lbl-sm">flatten the blade to 0° instantly!</text>
  <text x="784" y="628" class="ok">3. Auto Re-Engagement on Reset:</text>
  <text x="794" y="642" class="lbl-sm">Swing back to 0° → bevel V-key self-</text>
  <text x="794" y="655" class="lbl-sm">centers into cup (works w/ 0 V battery!).</text>
</svg>
