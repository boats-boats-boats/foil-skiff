<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="718" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1056" height="652" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">22. True 90° Upper &amp; Lower Fold Channels, Dyneema Pulley Loop &amp; Rotating Foil-Base Servo</text>
  <text x="24" y="46" class="sub">220 mm Total Folded Width (Fits Between 250 mm Rails!) • 100% Intact 26 L Dry Bay • Active 0.0° Pitch Control!</text>
  <rect x="24" y="68" width="510" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Front Cross-Section: Upper (13 mm) &amp; Lower (12 mm) Channels</text>
  <text x="42" y="109" class="ok">2×102 mm Main Wing + 2×105 mm Roof Blades nest 90° flush inside 220 mm!</text>
  <rect x="96" y="146" width="360" height="156" rx="34" fill="#F1F5F9" stroke="#0F172A" stroke-width="2.4"/>
  <rect x="120" y="146" width="312" height="22" rx="4" fill="#CCFBF1" stroke="#0F766E" stroke-width="1.4"/>
  <rect x="128" y="150" width="140" height="14" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <rect x="284" y="150" width="140" height="14" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <text x="276" y="136" text-anchor="middle" class="ok">Upper Fold Channel (13 mm): Switchblade OR Staggerwing (210 mm)</text>
  <rect x="140" y="180" width="272" height="86" rx="8" fill="#10B981" fill-opacity="0.22" stroke="#059669" stroke-width="1.6"/>
  <text x="276" y="218" text-anchor="middle" class="sec">100% Intact 26 L Dry IP68 Battery Bay</text>
  <text x="276" y="236" text-anchor="middle" class="lbl-sm">(2× Swappable 14 kg Cartridges + VESCs + IMU — ZERO intrusion!)</text>
  <rect x="120" y="278" width="312" height="24" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.4"/>
  <rect x="128" y="278" width="296" height="4" fill="#F97316"/>
  <rect x="128" y="298" width="296" height="4" fill="#F97316"/>
  <rect x="130" y="283" width="136" height="14" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.2"/>
  <rect x="286" y="283" width="136" height="14" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.2"/>
  <rect x="184" y="274" width="10" height="32" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  <rect x="358" y="274" width="10" height="32" rx="2" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  <rect x="264" y="284" width="24" height="12" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.1"/>
  <text x="276" y="322" text-anchor="middle" class="warn">Lower Fold Channel (12 mm): Main Wing 2×102 mm (Pivots @ y = ±54 mm)</text>
  <text x="42" y="346" class="ok">40 mm Inboard Overhang Roots: Carry 100% lift/roll in compression (~35 MPa, &gt;10×!).</text>
  <text x="42" y="366" class="lbl-sm">Zero Side-Wall Cutouts: Unlike hollowing the pod sides, top/bottom channels keep 100% dry bay!</text>
  <text x="42" y="384" class="dim">Total Pod Height: ~95–105 mm (vs 80 mm fixed) • Zero external hubs = ~0 lbf extra drag!</text>
  <rect x="550" y="68" width="506" height="332" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="568" y="92" class="sec">B. Closed-Loop Dyneema Pulley Deploy/Fold (Zero Sweep Motors!)</text>
  <text x="568" y="109" class="dim">One Ø2.5 mm SK78 loop wraps a single belly drum — drives BOTH meshed wings 0° ↔ 90° (&lt;8 kgf)!</text>
  <rect x="562" y="118" width="222" height="202" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="572" y="133" class="ok">B1. Side View: Coaxial Strut Routing</text>
  <rect x="572" y="139" width="54" height="13" rx="3" fill="#10B981" stroke="#065F46" stroke-width="1.1"/>
  <text x="599" y="148" text-anchor="middle" style="font-size:7.6px;fill:#FFFFFF;font-weight:700;">← DEPLOY</text>
  <rect x="572" y="155" width="54" height="13" rx="3" fill="#F97316" stroke="#9A3412" stroke-width="1.1"/>
  <text x="599" y="164" text-anchor="middle" style="font-size:7.6px;fill:#FFFFFF;font-weight:700;">← FOLD</text>
  <rect x="572" y="171" width="198" height="6" rx="2" fill="#475569" stroke="#0F172A" stroke-width="1"/>
  <line x1="714" y1="184" x2="774" y2="192" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" stroke-dasharray="4,3"/>
  <path d="M 728 224 A 34 34 0 0 0 750 198" fill="none" stroke="#64748B" stroke-width="1.3" stroke-dasharray="3,2"/>
  <text x="764" y="216" text-anchor="middle" style="font-size:7.6px;fill:#475569;font-weight:700;">86.5°</text>
  <text x="764" y="226" text-anchor="middle" style="font-size:7.2px;fill:#475569;">fold</text>
  <rect x="706" y="184" width="16" height="94" rx="3" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.3"/>
  <rect x="688" y="278" width="88" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <circle cx="714" cy="184" r="9" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <circle cx="714" cy="184" r="2.6" fill="#0F172A"/>
  <circle cx="714" cy="278" r="9" fill="#FBBF24" stroke="#78350F" stroke-width="1.3"/>
  <circle cx="714" cy="278" r="2.6" fill="#0F172A"/>
  <path d="M 626 145 L 708 145 L 708 284 L 774 284" fill="none" stroke="#059669" stroke-width="2.1" marker-end="url(#arrGreen)"/>
  <path d="M 626 161 L 720 161 L 720 294 L 774 294" fill="none" stroke="#F97316" stroke-width="2.1" stroke-dasharray="4,2" marker-end="url(#arrRed)"/>
  <text x="696" y="191" text-anchor="end" class="lbl-sm">Top Coaxial Pulley</text>
  <text x="696" y="202" text-anchor="end" style="font-size:7.6px;fill:#64748B;">(on strut hinge pin)</text>
  <text x="696" y="228" text-anchor="end" class="dim">2 lines inside</text>
  <text x="696" y="239" text-anchor="end" class="lbl-sm">strut TE groove</text>
  <text x="696" y="266" text-anchor="end" class="lbl-sm">Bottom Coaxial</text>
  <text x="696" y="276" text-anchor="end" style="font-size:7.6px;fill:#64748B;">Pulley (constant L!)</text>
  <text x="673" y="313" text-anchor="middle" class="warn">Lines enter Belly Drum → (B2)</text>
  <rect x="790" y="118" width="256" height="202" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="800" y="133" class="warn">B2. Bottom-Up: Belly Drum &amp; Wings</text>
  <rect x="810" y="178" width="224" height="80" rx="22" fill="#FEF3C7" fill-opacity="0.72" stroke="#D97706" stroke-width="1.4"/>
  <text x="816" y="173" style="font-size:7.4px;fill:#64748B;font-weight:700;">← BOW</text>
  <text x="1030" y="173" text-anchor="end" style="font-size:7.4px;fill:#64748B;font-weight:700;">STERN (90° AFT) →</text>
  <rect x="862" y="140" width="24" height="58" rx="4" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.3"/>
  <rect x="862" y="238" width="24" height="58" rx="4" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.3"/>
  <text x="856" y="150" text-anchor="end" class="ok">0° Deployed</text>
  <text x="856" y="160" text-anchor="end" style="font-size:7.6px;fill:#047857;">(Pull Green)</text>
  <rect x="882" y="186" width="110" height="22" rx="4" fill="#F97316" fill-opacity="0.32" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="4,2"/>
  <rect x="882" y="228" width="110" height="22" rx="4" fill="#F97316" fill-opacity="0.32" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="4,2"/>
  <text x="944" y="200" text-anchor="middle" style="font-size:8px;fill:#9A3412;font-weight:700;">90° Folded</text>
  <text x="944" y="242" text-anchor="middle" style="font-size:8px;fill:#9A3412;font-weight:700;">(Pull Orange)</text>
  <circle cx="874" cy="198" r="19" fill="url(#alu)" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="874" cy="238" r="19" fill="url(#alu)" stroke="#0F172A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="874" cy="198" r="11.5" fill="#FBBF24" stroke="#78350F" stroke-width="1.5"/>
  <path d="M 800 186.5 L 874 186.5 A 11.5 11.5 0 0 1 885.5 198" fill="none" stroke="#059669" stroke-width="2.3"/>
  <path d="M 885.5 198 A 11.5 11.5 0 0 1 874 209.5 L 800 209.5" fill="none" stroke="#F97316" stroke-width="2.3" stroke-dasharray="4,2"/>
  <line x1="824" y1="186.5" x2="800" y2="186.5" stroke="#059669" stroke-width="2.3" marker-end="url(#arrGreen)"/>
  <line x1="824" y1="209.5" x2="800" y2="209.5" stroke="#F97316" stroke-width="2.3" marker-end="url(#arrRed)"/>
  <circle cx="874" cy="198" r="4" fill="#0F172A"/>
  <circle cx="874" cy="238" r="4.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.1"/>
  <path d="M 964 176 A 72 72 0 0 0 894 146" fill="none" stroke="#059669" stroke-width="1.9" marker-end="url(#arrGreen)"/>
  <text x="952" y="152" class="ok">DEPLOY</text>
  <path d="M 894 288 A 72 72 0 0 0 964 260" fill="none" stroke="#F97316" stroke-width="1.9" marker-end="url(#arrRed)"/>
  <text x="952" y="286" class="warn">FOLD</text>
  <circle cx="902" cy="218" r="5.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.1"/>
  <text x="911" y="221" style="font-size:7.6px;fill:#B91C1C;font-weight:700;">Servo Pin</text>
  <circle cx="998" cy="218" r="4.5" fill="#0F766E" stroke="#FFFFFF" stroke-width="1"/>
  <text x="1005" y="221" style="font-size:7.4px;fill:#0F766E;font-weight:700;">Detent</text>
  <text x="918" y="313" text-anchor="middle" class="dim">1 Drum + Meshed Gears = Symmetric Swing!</text>
  <text x="568" y="338" class="ok">1. Pull Green (DEPLOY, &lt;8 kgf): Turns Port drum CCW + Stbd gear CW → wings lock at 0°!</text>
  <text x="568" y="356" class="warn">2. Drop Servo Pin to 0% &amp; Pull Orange (FOLD): Reverses drum → wings click 90° flat!</text>
  <text x="568" y="374" class="dim">3. Coaxial Hinge Pulleys: Line length stays constant as struts fold 0° ↔ 86.5° (0 slack!).</text>
  <text x="568" y="391" class="lbl-sm">Sand/saltwater-proof Ø2.5 mm SK78 Dyneema (700 kg!) + open Delrin sheaves • Zero motors!</text>
  <rect x="24" y="414" width="1032" height="284" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="438" class="sec">C. Active Flaperon 90° Fold: Embedded Rotating Wet IP68 Foil-Base Servo (Direct-Drive or Leveraged)</text>
  <text x="42" y="455" class="ok">Servo rides INSIDE the folding root carrier &amp; rotates 90° WITH the blade — exact 0.0° flat-lock before folding (never relies on water flow!)</text>
  <rect x="38" y="468" width="484" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="50" y="486" class="ok">C1. Deployed (0° Flight): Embedded IP68 Servo Direct-Drives (or Levers) Pitch Spar</text>
  <rect x="58" y="510" width="76" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <text x="96" y="530" text-anchor="middle" class="lbl-sm">Dry Pod</text>
  <text x="96" y="542" text-anchor="middle" style="font-size:7.6px;fill:#475569;">(ESP32/IMU)</text>
  <rect x="128" y="564" width="14" height="24" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <text x="104" y="604" text-anchor="middle" style="font-size:7.5px;fill:#0F766E;font-weight:700;">Static Gland</text>
  <text x="104" y="614" text-anchor="middle" style="font-size:7.2px;fill:#64748B;">(0 rotary seals!)</text>
  <rect x="166" y="548" width="114" height="62" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.6"/>
  <circle cx="182" cy="594" r="6.5" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <rect x="196" y="555" width="58" height="38" rx="4" fill="#FBBF24" stroke="#92400E" stroke-width="1.4"/>
  <text x="225" y="572" text-anchor="middle" style="font-size:8px;fill:#0F172A;font-weight:700;">Wet IP68</text>
  <text x="225" y="584" text-anchor="middle" style="font-size:7.6px;fill:#78350F;font-weight:700;">Servo</text>
  <rect x="254" y="570" width="38" height="10" rx="2" fill="#DC2626"/>
  <path d="M 142 576 Q 162 550 196 568" fill="none" stroke="#0284C7" stroke-width="2.4" stroke-dasharray="4,2"/>
  <text x="190" y="540" text-anchor="middle" class="dim">3-Wire Flex Loop</text>
  <rect x="280" y="552" width="218" height="54" rx="6" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.5"/>
  <text x="389" y="576" text-anchor="middle" style="font-size:10px;fill:#FFFFFF;font-weight:700;">Active Flaperon (Exact Closed-Loop Pitch)</text>
  <text x="389" y="591" text-anchor="middle" style="font-size:8.4px;fill:#E0F2FE;">±15° STOL / ±3° roll • Direct or 1.5:1 horn!</text>
  <text x="228" y="630" text-anchor="middle" class="ok">Ø10 mm Vertical Sweep Pivot</text>
  <text x="50" y="670" class="lbl-sm">Zero dog-clutch, zero dynamic O-rings — servo &amp; blade form 1 rigid watertight assembly!</text>
  <rect x="546" y="468" width="494" height="214" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="558" y="486" class="warn">C2. Folded 90° Straight Aft: Commanded 0.0° Flat-Lock (Servo Swings WITH Blade!)</text>
  <rect x="566" y="510" width="64" height="132" rx="8" fill="#E2E8F0" stroke="#475569" stroke-width="1.6"/>
  <rect x="624" y="564" width="12" height="24" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.2"/>
  <rect x="668" y="554" width="54" height="58" rx="7" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="680" cy="566" r="6" fill="#10B981" stroke="#065F46" stroke-width="1.4"/>
  <rect x="684" y="574" width="32" height="32" rx="4" fill="#FBBF24" stroke="#92400E" stroke-width="1.3"/>
  <text x="700" y="593" text-anchor="middle" style="font-size:7px;fill:#0F172A;font-weight:700;">IP68</text>
  <path d="M 636 576 Q 656 590 684 590" fill="none" stroke="#0284C7" stroke-width="2.4" stroke-dasharray="4,2"/>
  <rect x="676" y="610" width="42" height="60" rx="5" fill="#F97316" stroke="#9A3412" stroke-width="1.5"/>
  <text x="697" y="643" text-anchor="middle" style="font-size:7.6px;fill:#FFFFFF;font-weight:700;">0.0°</text>
  <path d="M 730 564 Q 758 584 736 624" fill="none" stroke="#059669" stroke-width="2.3" marker-end="url(#arrGreen)"/>
  <text x="768" y="520" class="ok">1. Exact 0.0° Flat-Lock Before Folding:</text>
  <text x="778" y="534" class="lbl-sm">Controller commands exact 0.0° flat —</text>
  <text x="778" y="547" class="lbl-sm">cross-currents/waves NEVER jam the slot!</text>
  <text x="768" y="569" class="dim">2. Zero Clutch Misalignment or Wear:</text>
  <text x="778" y="583" class="lbl-sm">Servo stays splined/levered at all angles;</text>
  <text x="778" y="596" class="lbl-sm">only a soft 3-wire pigtail flexes 90°!</text>
  <text x="768" y="618" class="warn">3. Compact Packaging Inside 220 mm Pod:</text>
  <text x="778" y="632" class="lbl-sm">20 mm direct-drive (or 15 mm levered)</text>
  <text x="778" y="645" class="lbl-sm">fits inside 60 mm chord (2×60 = 120 mm!).</text>
  <text x="778" y="666" class="ok">Impact safe: whole carrier sweeps aft!</text>
</svg>
