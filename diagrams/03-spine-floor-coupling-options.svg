  <rect x="1" y="1" width="1038" height="908" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="842" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">3. Drop-In Rigid Spine Floor &amp; Coupling Options (True Kit Navigator 300 Primary + Discovery 330)</text>
  <text x="24" y="46" class="sub">Bridging the Continuous 1.2 mm PVC Tunnel Web — Zero-Hole Navigator 300 Hybrid C-Frame, Switchable Magnets, Discovery O-Frame &amp; OEM Slot</text>
  <rect x="24" y="68" width="992" height="196" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.8"/>
  <text x="42" y="92" class="ok">1. PRIMARY (True Kit Navigator 300): Contoured Bow-Bent Hybrid C-Frame + 6 mm Dyneema Bow Sling</text>
  <text x="42" y="109" class="lbl-sm">Both Hard Deck &amp; under-hull plate bend UP with bow contour • Clamps onto Tru-Alu transom • Zero boxes above deck!</text>
