  <text x="42" y="302" class="sec">2. Option A (Navigator 300 / Universal Bolt-On): 4× Flush-Recessed Switchable Magnets + Transom Bridle</text>
  <text x="42" y="319" class="dim">~800 kgf clamp across 2.5 mm gap (flush-recessed inside 28 mm Hard Deck) • 5-sec drop-on • Built-in breakaway fuse</text>
  <path d="M 110 342 L 870 342 Q 920 342 920 406 Q 920 462 865 462 L 240 462 Q 150 458 95 414 Q 76 368 110 342 Z" fill="#E2E8F0" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,4"/>
