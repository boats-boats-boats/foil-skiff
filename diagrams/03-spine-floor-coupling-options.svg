  <text x="150" y="228" text-anchor="middle" class="dim">Bow Bridge</text>
  <text x="150" y="240" text-anchor="middle" class="lbl-sm">(Rock Bumper)</text>
  <text x="860" y="228" text-anchor="middle" class="dim">Transom Bridge</text>
  <text x="860" y="240" text-anchor="middle" class="lbl-sm">(Tackle + Wheels)</text>
  <rect x="24" y="282" width="992" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="306" class="sec">Option B2 (Closed-Bow Catamarans): Open-Transom "C-Frame" Wrap-Around Cantilever</text>
  <text x="42" y="323" class="dim">True Kit Navigator 300 • 180×30 mm Box Beam (~2.4 kg carbon / ~4.2 kg Alu) • Zero Holes • Direct Compression in Lift</text>
  <rect x="80" y="342" width="840" height="128" rx="46" fill="#E2E8F0" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,4"/>
