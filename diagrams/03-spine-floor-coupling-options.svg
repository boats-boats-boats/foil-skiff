  <rect x="1" y="1" width="1038" height="718" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="652" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">3. Drop-In Rigid Spine Floor &amp; Top-to-Bottom Coupling Architectures (Side Profiles)</text>
  <text x="24" y="46" class="sub">How to Bridge the Continuous 1.2 mm PVC Tunnel Ceiling Web on True Kit / Takacat Catamarans</text>
  <rect x="24" y="68" width="992" height="200" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">Option B1 (Top Zero-Hole Pick): Full Bow-to-Transom Twin-Rail "O-Frame" Clamshell</text>
  <text x="42" y="109" class="ok">True Kit Discovery &amp; Takacat LX • 2× 50×20 mm 6061-T6 Alu (~3.5 kg, ~$70) • 3×–4× lower bending moment • Pod retracts BETWEEN rails!</text>
  <rect x="80" y="128" width="840" height="128" rx="46" fill="#E2E8F0" fill-opacity="0.35" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="6,4"/>
