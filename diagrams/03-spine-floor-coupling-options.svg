  <text x="118" y="348" text-anchor="middle" class="lbl-sm">Closed Bow</text>
  <text x="875" y="372" text-anchor="middle" class="ok">Open Transom</text>
  <rect x="175" y="380" width="322" height="16" rx="3" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="501" y="380" width="324" height="16" rx="3" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="492" y="378" width="14" height="20" rx="2" fill="#FBBF24" stroke="#0F172A" stroke-width="1"/>
  <text x="336" y="392" text-anchor="middle" class="lbl-w">Top Rigid Spine Floor (Front Half)</text>
  <text x="663" y="392" text-anchor="middle" class="lbl-w">Top Rigid Spine Floor (Rear Half)</text>
