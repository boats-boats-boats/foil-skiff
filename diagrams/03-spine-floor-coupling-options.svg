  <rect x="501" y="586" width="324" height="15" rx="3" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.4"/>
  <rect x="492" y="584" width="14" height="19" rx="2" fill="#FBBF24" stroke="#0F172A" stroke-width="1"/>
  <text x="355" y="597" text-anchor="middle" class="lbl-w">Bow-Contoured Hard Deck</text>
  <text x="663" y="597" text-anchor="middle" class="lbl-w">Rear Hard Deck (100% Flush!)</text>
  <path d="M 164 572 L 146 572 L 146 596 Q 216 618 288 619 L 846 619 L 846 594 L 825 594" fill="none" stroke="#0284C7" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="385" cy="619" r="4.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.2"/>
  <circle cx="595" cy="619" r="4.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.2"/>
  <text x="490" y="652" text-anchor="middle" class="dim">Bow-Contoured Closed Rigid Loop Around Open Bow &amp; Open Transom (Splits to 1.0 m Halves)</text>
  <rect x="24" y="698" width="992" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="722" class="sec">4. Option C (Official Factory OEM "Foil Edition"): RF-Welded Centerboard Slot in Non-Airtight Web</text>
  <text x="42" y="739" class="lbl-sm">Lightest (~1.0–1.5 kg) &amp; cleanest tunnel • Zero airtight tubes touched • Tunnel ceiling sits ABOVE static waterline (no flooding!)</text>
