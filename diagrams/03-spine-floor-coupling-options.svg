  <text x="440" y="444" text-anchor="middle" class="lbl">Rubber Grip Pads (μ ≈ 0.7) + Sealed Steel Keeper (~2.5 mm Gap)</text>
  <text x="800" y="428" text-anchor="middle" class="warn">Transom Shear /</text>
  <text x="800" y="441" text-anchor="middle" class="warn">Breakaway Bridle</text>
  <rect x="24" y="488" width="992" height="196" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="512" class="sec">3. Option B2 (Open-Bow Secondary Ref — True Kit Discovery 330 / Takacat LX): Contoured Rigid "O-Frame"</text>
  <text x="42" y="529" class="lbl-sm">Open square bow lets bow-bent 2× 50×20 mm Alu rails wrap BOTH ends rigidly (~3.5 kg, 3×–4× lower bending moment)</text>
