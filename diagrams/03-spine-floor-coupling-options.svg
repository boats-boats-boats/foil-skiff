  <circle cx="600" cy="416" r="4.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.2"/>
  <line x1="490" y1="450" x2="490" y2="425" stroke="#059669" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text x="490" y="464" text-anchor="middle" class="lbl">0 Cantilever While Foiling (Compresses Up Into Spine Floor) • 1.1 m Cantilever Only Under Hanging Pod Weight (~917 N·m 2G)</text>
  <text x="895" y="424" text-anchor="middle" class="lbl-sm">Transom</text>
  <text x="895" y="436" text-anchor="middle" class="lbl-sm">C-Gusset</text>
  <rect x="24" y="496" width="992" height="204" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="520" class="sec">Option C (Official Factory OEM "Foil Edition"): RF-Welded Centerboard Slot in Non-Airtight Web</text>
  <text x="42" y="537" class="lbl-sm">Lightest (~1.0–1.5 kg) &amp; cleanest tunnel • Zero airtight tubes touched • Tunnel ceiling sits ABOVE static waterline (no flooding!)</text>
