  <rect x="447" y="586" width="106" height="24" rx="3" fill="none" stroke="#0284C7" stroke-width="2.2"/>
  <rect x="486" y="576" width="28" height="114" rx="4" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="456" y1="614" x2="485" y2="614" stroke="#F59E0B" stroke-width="3.5"/>
  <line x1="515" y1="614" x2="544" y2="614" stroke="#F59E0B" stroke-width="3.5"/>
  <text x="372" y="582" text-anchor="end" class="dim">CNC Cassette Well (Carries 100% Load)</text>
  <line x1="378" y1="579" x2="444" y2="594" stroke="#0284C7" stroke-width="1.2" marker-end="url(#arrBlue)"/>
  <text x="615" y="584" class="ok">RF-Welded PVC Collar Boot + Flush Split-Neoprene Spray Gasket</text>
  <line x1="610" y1="581" x2="548" y2="600" stroke="#059669" stroke-width="1.2" marker-end="url(#arrGreen)"/>
  <text x="615" y="632" class="lbl-sm">Snap-in HDPE blanking plug seals slot smoothly when sailing without foil</text>
