  <text x="150" y="225" text-anchor="middle" class="lbl-sm">6 mm Dyneema Sling</text>
  <text x="530" y="250" text-anchor="middle" class="ok">Upward Lift Compresses Into Contoured Hard Deck • 250 mm Rails Let Pod Retract Flat!</text>
  <text x="898" y="208" text-anchor="middle" class="dim">Transom Clamp</text>
  <text x="898" y="220" text-anchor="middle" class="lbl-sm">(Like Outboard!)</text>
