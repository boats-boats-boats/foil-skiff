  <circle cx="846" cy="181" r="4" fill="#FBBF24" stroke="#0F172A" stroke-width="1.1"/>
  <text x="774" y="185" text-anchor="middle" class="lbl-w">Long-Range 1.50–1.55 m (AR 13.5–14)</text>
  <text x="774" y="206" text-anchor="middle" class="lbl-sm">Gold tip hinges fold outer tips 90° aft cleanly inside 600 mm tunnel</text>
  <text x="556" y="236" class="lbl">80/20 Sweet Spot (Model 6):</text>
  <text x="556" y="250" class="lbl-sm">Keep 4× 60×9 mm blades + Split STOL</text>
  <text x="556" y="264" class="ok">125 Wh/nm @ 12 kn • 5.5" sand clear!</text>
  <line x1="774" y1="224" x2="774" y2="306" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="790" y="236" class="dim">Max-Range Full 4-Swap (Model 7):</text>
  <text x="790" y="250" class="lbl-sm">2× 100×18 mm center struts + Switchblade</text>
  <text x="790" y="264" class="ok">118 Wh/nm @ 12 kn • 142 @ 15.5 kn!</text>
  <text x="556" y="294" class="lbl-sm">Swap #4 (Both): Low bow spray dodger cuts wind drag ~1.6 lbf (~6 Wh/nm) + dry 5-hr runs.</text>
  <rect x="24" y="336" width="992" height="260" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
