  <rect x="1" y="1" width="1038" height="618" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="552" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">16. Long-Range (60–75+ nm) Hydro Package Swaps &amp; Battery Recipes (Navigator 300)</text>
  <text x="24" y="46" class="sub">4 Hardware Swaps Cutting Energy Burn 28% (195 → 142 Wh/nm @ 15.5 kn | 165 → 118 Wh/nm @ 12 kn) + 3 Pack Options</text>
  <rect x="24" y="68" width="484" height="252" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Swap #1 (~50% of Gain): Single 65161 + 10" CNC Prop</text>
  <text x="42" y="109" class="ok">Saves -3.5 lbf drag &amp; boosts eff. 63% → 70% (-32 Wh/nm @ 15.5 kn!)</text>
  <text x="42" y="136" class="lbl-sm">Standard: Twin 65161 + 7.5" Props (63% eff., diff. steer)</text>
