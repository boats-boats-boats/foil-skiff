  <text x="550" y="109" class="dim">Induced drag drops ~30% (1.05 m → 1.55 m span) • Struts 11.4 → 9.1 lbf</text>
  <rect x="679" y="138" width="190" height="22" rx="8" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2" stroke-dasharray="4,2"/>
  <text x="774" y="153" text-anchor="middle" class="lbl-sm">Standard 1.05 m (AR ≈ 9)</text>
