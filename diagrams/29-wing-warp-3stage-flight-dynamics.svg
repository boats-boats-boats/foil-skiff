<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640">
  <defs>
    <style>
      .bg { fill: #0B1220; }
      .card { fill: #111A2E; stroke: #243352; stroke-width: 1.5; rx: 10; }
      .title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F8FAFC; }
      .sub { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .sec { font: 700 13.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #38BDF8; }
      .lbl { font: 600 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #E2E8F0; }
      .mut { font: 400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94A3B8; }
      .ok  { font: 700 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #34D399; }
      .wrn { font: 700 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #FBBF24; }
      .err { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #F87171; }
    </style>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="640" class="bg"/>
  <text x="28" y="34" class="title">FoilSkiff PRIMARY — 3-Stage 4-Float Flight &amp; Parallel-Float Internal Blade-Tang Wing-Warping</text>
  <text x="28" y="54" class="sub">True Kit Navigator 300 (Ø460 mm Tubes, ~3&quot; Tunnel) • Fixed Rigid Tie-Bars (ZERO Slip-Tubes!) • Fixed Lower Pivot Pin + Internal Dry Tr8 Linear Actuators</text>

  <!-- ==================== TOP ROW: 3-STAGE FLIGHT WATERLINES ==================== -->
  <rect x="24" y="72" width="346" height="252" class="card"/>
  <text x="40" y="96" class="sec">Stage 1: 0–5 kn Takeoff (Lowered Pre-Lift)</text>
  <text x="40" y="113" class="mut">WL = +50 mm above tube bottom • 4× Floats 75% submerged</text>
  <rect x="34" y="156" width="326" height="148" fill="url(#water)"/>
  <line x1="34" y1="156" x2="360" y2="156" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(0, 14)">
    <circle cx="136" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <circle cx="258" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="158" y="132" width="78" height="12" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="184" y1="144" x2="184" y2="232" stroke="#64748B" stroke-width="3"/>
    <line x1="210" y1="144" x2="210" y2="232" stroke="#64748B" stroke-width="3"/>
    <path d="M 94 176 L 94 214 Q 94 234 118 234 L 276 234 Q 300 234 300 214 L 300 176" fill="none" stroke="#0EA5E9" stroke-width="5"/>
    <rect x="85" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <rect x="291" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <line x1="84" y1="204" x2="104" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <line x1="290" y1="204" x2="310" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <ellipse cx="197" cy="234" rx="18" ry="9" fill="#0D9488" stroke="#F8FAFC" stroke-width="1.3"/>
  </g>
  <text x="197" y="290" class="ok" text-anchor="middle">~100 kgf Pre-Lift Buoyancy + All 4 Tangs +2.5°</text>
  <text x="197" y="308" class="mut" text-anchor="middle">Tubes 50%–75% unloaded → Effortless ~5.2 kn Lift-Off!</text>

  <rect x="387" y="72" width="346" height="252" class="card"/>
  <text x="403" y="96" class="sec">Stage 2: 6–10 kn Low Foil (Passive Climb)</text>
  <text x="403" y="113" class="mut">WL = −100 mm • Tubes +100 mm clear • Floats 150 mm wet</text>
  <rect x="397" y="168" width="326" height="136" fill="url(#water)"/>
  <line x1="397" y1="168" x2="723" y2="168" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(363, -2)">
    <circle cx="136" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <circle cx="258" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="158" y="132" width="78" height="12" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="184" y1="144" x2="184" y2="232" stroke="#64748B" stroke-width="3"/>
    <line x1="210" y1="144" x2="210" y2="232" stroke="#64748B" stroke-width="3"/>
    <path d="M 94 176 L 94 214 Q 94 234 118 234 L 276 234 Q 300 234 300 214 L 300 176" fill="none" stroke="#0EA5E9" stroke-width="5"/>
    <rect x="85" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <rect x="291" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <line x1="84" y1="204" x2="104" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <line x1="290" y1="204" x2="310" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <ellipse cx="197" cy="234" rx="18" ry="9" fill="#0D9488" stroke="#F8FAFC" stroke-width="1.3"/>
  </g>
  <text x="560" y="290" class="wrn" text-anchor="middle">4-Corner Linear Unloading (~10.5 kgf / 10 cm)</text>
  <text x="560" y="308" class="mut" text-anchor="middle">Floats stay 100% level &amp; parallel through climb</text>

  <rect x="750" y="72" width="346" height="252" class="card"/>
  <text x="766" y="96" class="sec">Stage 3: 12–15.5 kn Cruise (Floats DRY!)</text>
  <text x="766" y="113" class="mut">WL = −280 mm • Floats +30 mm DRY • Main Foil 320 mm deep</text>
  <rect x="760" y="182" width="326" height="122" fill="url(#water)"/>
  <line x1="760" y1="182" x2="1086" y2="182" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <g transform="translate(726, -18)">
    <circle cx="136" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <circle cx="258" cy="128" r="24" fill="#CBD5E1" fill-opacity="0.22" stroke="#94A3B8" stroke-width="1.4"/>
    <rect x="158" y="132" width="78" height="12" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="184" y1="144" x2="184" y2="232" stroke="#64748B" stroke-width="3"/>
    <line x1="210" y1="144" x2="210" y2="232" stroke="#64748B" stroke-width="3"/>
    <path d="M 94 176 L 94 214 Q 94 234 118 234 L 276 234 Q 300 234 300 214 L 300 176" fill="none" stroke="#0EA5E9" stroke-width="5"/>
    <rect x="85" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <rect x="291" y="134" width="18" height="50" rx="6" fill="#F97316" stroke="#F8FAFC" stroke-width="1.2"/>
    <line x1="84" y1="204" x2="104" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <line x1="290" y1="204" x2="310" y2="204" stroke="#F87171" stroke-width="2.5"/>
    <ellipse cx="197" cy="234" rx="18" ry="9" fill="#0D9488" stroke="#F8FAFC" stroke-width="1.3"/>
  </g>
  <text x="923" y="290" class="ok" text-anchor="middle">0 N Float Water Drag • ~33 nm @ 12 kn!</text>
  <text x="923" y="308" class="mut" text-anchor="middle">Only 18 mm blades + 28 L pod wet • Dry warp locks height</text>

  <!-- ==================== BOTTOM LEFT: PARALLEL FLOATS + FIXED TIE-BAR + INTERNAL BLADE TANGS ==================== -->
  <rect x="24" y="340" width="668" height="278" class="card"/>
  <text x="42" y="366" class="sec">Side Elevation — Parallel Floats + Solid Fixed Tie-Bar + Internal Blade-Tang Actuators</text>
  <text x="42" y="383" class="mut">Floats NEVER tilt • Fixed Ø10 mm lower pivot pin • Dry Tr8 linear actuator pushes tang ±17 mm inside free-flooding center trunk</text>

  <rect x="36" y="514" width="644" height="92" fill="url(#water)"/>
  <line x1="36" y1="514" x2="680" y2="514" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="48" y="508" class="mut">12–15.5 kn Waterline (Floats +30 mm DRY &amp; Parallel)</text>

  <!-- SOLID FIXED-LENGTH CARBON TIE-BAR (ZERO SLIP-TUBE!) -->
  <rect x="254" y="428" width="202" height="12" rx="4" fill="#94A3B8"/>
  <text x="355" y="420" class="ok" text-anchor="middle">100% Solid Fixed Ø34 mm Carbon Tie-Bar</text>
  <text x="355" y="454" class="mut" text-anchor="middle">(ZERO telescoping joints or sliding bushings!)</text>

  <!-- Rigid Parallel Front & Rear Floats + Internal Trunks -->
  <rect x="112" y="406" width="148" height="92" rx="20" fill="#F97316" fill-opacity="0.25" stroke="#F97316" stroke-width="1.8"/>
  <rect x="164" y="412" width="48" height="86" rx="4" fill="#0F172A" fill-opacity="0.75" stroke="#64748B" stroke-dasharray="3 2"/>
  <rect x="450" y="406" width="148" height="92" rx="20" fill="#F97316" fill-opacity="0.25" stroke="#F97316" stroke-width="1.8"/>
  <rect x="498" y="412" width="48" height="86" rx="4" fill="#0F172A" fill-opacity="0.75" stroke="#64748B" stroke-dasharray="3 2"/>

  <!-- Front Rocking Blade Tang rotating around FIXED lower pivot (188, 492) -->
  <g transform="rotate(-6, 188, 492)">
    <rect x="178" y="420" width="20" height="74" rx="2" fill="#0EA5E9" stroke="#F8FAFC" stroke-width="1.2"/>
    <rect x="174" y="492" width="28" height="84" rx="2" fill="#0EA5E9" fill-opacity="0.78" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="164" y="524" width="48" height="5" rx="1.5" fill="#F87171"/>
    <path d="M 158 576 C 168 567, 202 568, 238 576 C 208 583, 172 583, 158 576 Z" fill="#0EA5E9" stroke="#F8FAFC" stroke-width="1.4"/>
    <circle cx="188" cy="576" r="4" fill="#FBBF24"/>
  </g>
  <!-- Rear Rocking Blade Tang rotating around FIXED lower pivot (522, 492) -->
  <g transform="rotate(6, 522, 492)">
    <rect x="513" y="420" width="18" height="74" rx="2" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.2"/>
    <rect x="510" y="492" width="24" height="58" rx="2" fill="#14B8A6" fill-opacity="0.80" stroke="#E2E8F0" stroke-width="1.2"/>
    <rect x="502" y="522" width="40" height="5" rx="1.5" fill="#F87171"/>
    <path d="M 500 550 C 508 543, 536 543, 564 550 C 540 556, 512 556, 500 550 Z" fill="#14B8A6" stroke="#F8FAFC" stroke-width="1.4"/>
    <circle cx="522" cy="550" r="4" fill="#FBBF24"/>
  </g>

  <!-- Horizontal Dry Linear Actuators inside float tops -->
  <rect x="118" y="422" width="40" height="12" rx="3" fill="#CBD5E1"/>
  <line x1="158" y1="428" x2="181" y2="428" stroke="#FBBF24" stroke-width="4"/>
  <rect x="552" y="422" width="40" height="12" rx="3" fill="#CBD5E1"/>
  <line x1="552" y1="428" x2="529" y2="428" stroke="#FBBF24" stroke-width="4"/>

  <!-- FIXED LOWER PIVOT PINS (RED!) -->
  <circle cx="188" cy="492" r="5.5" fill="#F87171" stroke="#F8FAFC" stroke-width="1.4"/>
  <circle cx="522" cy="492" r="5.5" fill="#F87171" stroke="#F8FAFC" stroke-width="1.4"/>
  <text x="355" y="496" class="err" text-anchor="middle">← Fixed Ø10 mm Lower Pivot Pins (Float Bottom) →</text>

  <text x="188" y="600" class="lbl" text-anchor="middle">Front Main Foil (25%-c UD Spar)</text>
  <text x="522" y="600" class="lbl" text-anchor="middle">Rear Staggered Foil (+130 mm High)</text>

  <!-- ==================== BOTTOM RIGHT: KEY ENGINEERING NUMBERS ==================== -->
  <rect x="708" y="340" width="388" height="278" class="card"/>
  <text x="726" y="366" class="sec">Verified Parallel-Float Wing-Warp Specs</text>

  <text x="726" y="394" class="lbl">1. Internal Tang Lever (320 mm Inside Float)</text>
  <text x="738" y="412" class="mut">• Linear Actuator Stroke: ±17 mm → ±3.0° foil AoA</text>
  <text x="738" y="428" class="mut">• Peak Force: ~100 N (10.2 kgf) — $35 IP67 Tr8 unit!</text>

  <text x="726" y="454" class="lbl">2. Zero Telescoping Tubes &amp; Zero Water Seals</text>
  <text x="738" y="472" class="ok">• Solid Ø34 mm fixed tie-bar locks floats 100% parallel</text>
  <text x="738" y="488" class="ok">• Free-flooding blade trunk; foam fore/aft unsinkable</text>

  <text x="726" y="514" class="lbl">3. Mandatory Divergence Safety (&gt;50–60 kn)</text>
  <text x="738" y="532" class="ok">• 0° UD Carbon Spar dead-on 25%–28% chord (e ≤ 3 mm)</text>
  <text x="738" y="548" class="ok">• Self-locking Tr8 actuator holds tip rigid (4× margin!)</text>

  <text x="726" y="574" class="lbl">4. Propulsion &amp; Cruise Range (5.38 kWh)</text>
  <text x="738" y="592" class="mut">• Twin Fixed Ø108 mm Rear Jets (132.5 cm², 0 servos)</text>
  <text x="738" y="608" class="wrn">• Range: ~33.0 nm @ 12 kn | ~20.5 nm @ 15.5 kn</text>
</svg>
