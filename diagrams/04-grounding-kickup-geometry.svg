  <line x1="38" y1="402.5" x2="494" y2="402.5" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="488" y="397.5" text-anchor="end" class="warn">Nose Plows 27 cm Deeper (-91 cm!)</text>
