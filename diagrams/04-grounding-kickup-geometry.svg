  <circle cx="917.4" cy="188.1" r="3.6" fill="#FBBF24" stroke="#0F172A" stroke-width="1.1"/>
  <text x="827.4" y="192.1" text-anchor="middle" class="ok">85°: 100% FLAT &amp; TUCKED!</text>
  <circle cx="588.0" cy="175" r="4.8" fill="#FBBF24" stroke="#0F172A" stroke-width="1.3"/>
  <circle cx="768.0" cy="175" r="4.8" fill="#FBBF24" stroke="#0F172A" stroke-width="1.3"/>
  <text x="550" y="498" class="ok">Verdict: Simple 4-pin/side parallelogram kicks pod flat UP &amp; AFT over reefs</text>
