  <text x="774.4" y="293.9" text-anchor="middle" class="dim">40° Kick-Up: Flat (-50 cm)</text>
  <line x1="588.0" y1="175.0" x2="737.4" y2="188.1" stroke="#059669" stroke-width="5.2" stroke-dasharray="none" stroke-linecap="round"/>
  <line x1="768.0" y1="175.0" x2="917.4" y2="188.1" stroke="#059669" stroke-width="5.2" stroke-dasharray="none" stroke-linecap="round"/>
