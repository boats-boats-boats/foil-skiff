  <line x1="230" y1="175" x2="326.4" y2="289.9" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
  <polygon points="208.4,402.0 457.3,193.1 444.5,177.8 195.5,386.7" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <circle cx="230" cy="175" r="5.5" fill="#FBBF24" stroke="#0F172A" stroke-width="1.5"/>
  <circle cx="444.5" cy="177.8" r="14" fill="#DC2626" fill-opacity="0.22" stroke="#DC2626" stroke-width="2"/>
  <text x="448.5" y="207.8" text-anchor="middle" class="warn">FLOOR CRASH @ 40°!</text>
  <circle cx="208.4" cy="402.0" r="6" fill="#DC2626"/>
  <text x="248.4" y="428.0" text-anchor="middle" class="warn">Nose Dives to -91 cm!</text>
  <line x1="72.0" y1="335.0" x2="72.0" y2="402.5" stroke="#DC2626" stroke-width="1.2" marker-start="url(#arrRed)" marker-end="url(#arrRed)"/>
  <text x="104.0" y="372.8" text-anchor="middle" class="warn">-27 cm!</text>
  <text x="42" y="498" class="lbl">Verdict: Single central mast works ONLY for vertical daggerboard slide</text>
  <text x="42" y="514" class="lbl-sm">(Option C OEM slot) or short dry-floor foils — NEVER pivot a 1.3 m pod!</text>
  <rect x="532" y="68" width="484" height="468" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="550" y="92" class="ok">B. MANDATORY: 4-Bar Parallelogram Struts (4× Blades)</text>
  <text x="550" y="109" class="lbl-sm">Pod &amp; STOL flaperons stay 100% HORIZONTAL (0°→85°) — zero upper wing needed!</text>
  <path d="M 552 149 Q 576 163 608 163 L 1002 163 L 1002 175 L 608 175 Q 572 175 546 161 Z" fill="#0284C7"/>
  <text x="795" y="172" text-anchor="middle" class="lbl-w">Bow-Contoured Under-Hull Rails (y = 0 cm)</text>
  <line x1="546" y1="335.0" x2="1002" y2="335.0" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="996" y="330.0" text-anchor="end" class="lbl-sm">Deployed (-64 cm)</text>
