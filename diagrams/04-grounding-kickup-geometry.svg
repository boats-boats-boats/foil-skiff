  <rect x="1" y="1" width="1038" height="558" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="492" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">4. Grounding Kick-Up Kinematics: Why a Single Central Mast Fails vs. 4-Bar Parallelogram</text>
  <text x="24" y="46" class="sub">Exact-Scale Sweep (0.60 m Strut, 1.30 m Pod) — Single Mast Crashes Tail Into Floor @ 40° &amp; Plows Nose 27 cm Deeper!</text>
  <rect x="24" y="68" width="484" height="468" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="warn">A. AVOID: Single Central "Inverted-T" Mast Kick-Up</text>
  <text x="42" y="109" class="lbl-sm">At just 40° aft kick-up, tail smashes PVC ceiling (-1 cm) &amp; nose plows to -91 cm!</text>
  <rect x="38" y="161" width="456" height="14" rx="2" fill="#64748B"/>
  <text x="50" y="172" class="lbl-w">Tunnel Ceiling / PVC Web (y = 0 cm)</text>
