  <path d="M 768 205 Q 810 202 835 178" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrGreen)"/>
  <text x="646" y="185" text-anchor="end" class="warn">Delrin Shear Pin</text>
  <text x="646" y="197" text-anchor="end" class="lbl-sm">(~140 kgf release)</text>
  <text x="795" y="168" class="ok">Top Pin @ TE (+24 mm)</text>
  <text x="795" y="218" class="lbl-sm">Kicks aft cleanly on impact</text>
  <text x="676" y="224" text-anchor="end" class="warn">Line Cutter</text>
  <text x="795" y="264" class="dim">Bottom Pin @ LE (-24 mm)</text>
  <text x="795" y="278" class="lbl-sm">(55 mm recess → 135 mm fold)</text>
  <text x="550" y="306" class="ok">Forward 70 mm stop shoulder takes 100% cruise thrust in solid compression.</text>
  <text x="550" y="320" class="lbl-sm">±45° carbon torsion wrap + 0° UD spars hold stress &lt;140 MPa (&gt;5.5× safety).</text>
  <rect x="24" y="344" width="992" height="272" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="368" class="sec">C. Front Cross-Section: How Upper 260 mm T-Head &amp; Lower 180 mm Pod Saddle Carry Roll &amp; Side Thrust</text>
  <text x="42" y="385" class="lbl-sm">Wide full-span axles cut pin bearing loads 8.3× vs. narrow clevis • Flanged UHMW/bronze thrust washers prevent sideways kick-up binding!</text>
  <rect x="155" y="400" width="380" height="14" rx="3" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.3"/>
  <rect x="197" y="416" width="296" height="8" rx="2" fill="url(#alu)" stroke="#334155" stroke-width="1.2"/>
