  <line x1="247.0" y1="610.0" x2="443.0" y2="610.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="345.0" y="606.0" text-anchor="middle" class="dim">200 mm V-Cradle &amp; 180 mm Saddle</text>
  <rect x="572" y="400" width="426" height="202" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="588" y="422" class="sec">3-Stage Asymmetric Load &amp; Impact Protection</text>
  <text x="588" y="444" class="warn">1. Central 120° V-Cradle Breakaway Socket (BOTH Halves!):</text>
  <text x="598" y="460" class="lbl-sm">• 2× Ø8 mm corner Delrin pins (y=±95 mm) pop BOTH halves @ ~70 kgf tip</text>
  <text x="598" y="473" class="lbl-sm">  hit (zero half-wing flip!); UHMW flanges take 100% lift/roll, 0.35 m leash.</text>
  <text x="588" y="496" class="ok">2. Upper End (250 mm Full-Span T-Head Trunnion):</text>
  <text x="598" y="512" class="lbl-sm">• Ø16 mm SS axle across BOTH rails cuts pin load 8.3× (1.1 t → 132 kgf).</text>
  <text x="598" y="525" class="lbl-sm">• Anti-splay bridge + UHMW thrust washers (μ≈0.08) stop kick-up binding!</text>
  <text x="588" y="548" class="dim">3. Lower End (180 mm Recessed Pod Saddle Trunnion):</text>
  <text x="598" y="564" class="lbl-sm">• Strut flares inside 55 mm recess onto Ø16 mm axle anchored into twin</text>
  <text x="598" y="577" class="lbl-sm">  6 mm G10/carbon full-height internal pod bulkheads (green) + line cutter.</text>
  <text x="598" y="593" class="ok">• Smart Divider: Center shoal (~140 kgf) → Strut kicks up (wing stays on!)</text>
