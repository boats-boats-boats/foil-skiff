  <text x="24" y="28" class="title">21. 2× Recessed Center Struts &amp; True 90° Upper/Lower Channel Linked-Fold Protection</text>
  <text x="24" y="46" class="sub">90° Flush Under/Above Channels (220 mm Dart!) + Wet IP68 Servo Variable-Preload Pins + Wide T-Head &amp; Pod Saddle Trunnions</text>
  <rect x="24" y="68" width="508" height="346" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
