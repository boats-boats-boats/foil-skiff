  <text x="606" y="536" class="warn">1. Unified Linked-Fold Main Foil (BOTH Halves Sweep 82°!):</text>
  <text x="616" y="552" class="lbl-sm">• 1× Ø8 mm dbl-shear Delrin pin snaps @ ~85 kgf tip hit → intermeshing</text>
