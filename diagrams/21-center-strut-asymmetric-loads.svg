  <rect x="1" y="1" width="1038" height="638" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="572" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">21. 2× Recessed Center Struts: Upper/Lower Trunnions &amp; One-Sided Impact Protection</text>
  <text x="24" y="46" class="sub">How Wide T-Head / Pod Saddle Trunnions + Wingtip Shear Fuse Survive Asymmetric Roll &amp; One-Sided Crab-Pot / Rock Strikes</text>
  <rect x="24" y="68" width="484" height="262" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Top-Down: One-Sided Crab-Pot / Rock Strike</text>
  <text x="42" y="109" class="ok">Stage 1 Tip Fuse sheds impact • 760 mm struts convert Yaw Mz into lateral couple!</text>
  <rect x="153" y="190" width="190" height="32" rx="14" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.5"/>
