  <text x="676" y="214" text-anchor="end" class="warn">Line Cutter</text>
  <text x="795" y="246" class="dim">Bottom Pin @ LE (-24 mm)</text>
  <text x="838" y="294" class="ok">12° Down-Exit (under UP flaps!)</text>
  <text x="664" y="292" text-anchor="end" class="lbl-sm">V-Cradle + Hall</text>
  <text x="550" y="314" class="ok">Center hit (&gt;140 kgf) kicks struts up; Tip hit (~70 kgf) pops V-cradle cleanly!</text>
  <rect x="24" y="344" width="992" height="272" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="368" class="sec">C. Front Cross-Section: How Upper 260 mm T-Head &amp; Lower 180 mm Pod Saddle Carry Roll &amp; Side Thrust</text>
  <text x="42" y="385" class="lbl-sm">Wide full-span axles cut pin bearing loads 8.3× vs. narrow clevis • Flanged UHMW/bronze thrust washers prevent sideways kick-up binding!</text>
