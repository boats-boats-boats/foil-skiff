  <circle cx="748" cy="160" r="6" fill="#FBBF24" stroke="#0F172A" stroke-width="1.4"/>
  <circle cx="712" cy="256" r="6" fill="#FBBF24" stroke="#0F172A" stroke-width="1.4"/>
