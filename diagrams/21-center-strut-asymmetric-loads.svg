  <rect x="247" y="558" width="196" height="8" rx="3" fill="#FBBF24" stroke="#78350F" stroke-width="1.2"/>
  <line x1="197" y1="490" x2="197" y2="462" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <line x1="493" y1="462" x2="493" y2="490" stroke="#0284C7" stroke-width="2.2" marker-end="url(#arrBlue)"/>
  <text x="191" y="484" text-anchor="end" class="dim">Push/Pull</text>
  <text x="191" y="497" text-anchor="end" class="lbl-sm">132 kgf/rail</text>
  <line x1="165" y1="562" x2="221" y2="562" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrRed)"/>
  <text x="161" y="566" text-anchor="end" class="warn">±F_lat Thrust</text>
  <line x1="220.0" y1="408.0" x2="470.0" y2="408.0" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="345.0" y="402.0" text-anchor="middle" class="ok">250 mm Bearing Span (8.3× Lower Load!)</text>
  <line x1="257.0" y1="606.0" x2="433.0" y2="606.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="345.0" y="602.0" text-anchor="middle" class="dim">180 mm Pod Saddle Span</text>
  <rect x="572" y="400" width="426" height="202" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="588" y="422" class="sec">3-Stage Asymmetric Load &amp; Impact Protection</text>
  <text x="588" y="444" class="ok">1. Upper End (250 mm Full-Span T-Head Trunnion):</text>
  <text x="598" y="460" class="lbl-sm">• Ø16 mm SS axle across BOTH rails cuts pin load 8.3× (1.1 t → 132 kgf).</text>
  <text x="598" y="474" class="lbl-sm">• Anti-splay bridge + orange UHMW/bronze thrust washers take ±220 kgf</text>
  <text x="598" y="487" class="lbl-sm">  sideways thrust with μ ≈ 0.08 so struts NEVER bind during kick-up!</text>
  <text x="588" y="510" class="dim">2. Lower End (180 mm Recessed Pod Saddle Trunnion):</text>
  <text x="598" y="526" class="lbl-sm">• Strut flares inside 55 mm top recess onto Ø16 mm axle anchored into</text>
  <text x="598" y="539" class="lbl-sm">  twin 6 mm G10/carbon full-height internal pod bulkheads (green).</text>
  <text x="588" y="562" class="warn">3. One-Sided Crab-Pot / Rock Hit Fuse (Outer Wingtips):</text>
  <text x="598" y="578" class="lbl-sm">• $0.50 Ø5 mm Delrin tip pin shears @ ~70 kgf → tip folds 90° aft cleanly,</text>
  <text x="598" y="591" class="lbl-sm">  shedding crab-pot lines &amp; capping yaw torque before struts even flex!</text>
