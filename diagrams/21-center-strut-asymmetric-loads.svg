  <text x="264.0" y="130.0" text-anchor="middle" class="dim">760 mm Tandem</text>
  <text x="42" y="302" class="ok">Stage 1 Fuse: 2× Ø8 mm corner pins (190 mm apart) pop BOTH halves @ ~70 kgf tip hit!</text>
  <text x="42" y="318" class="lbl-sm">Zero half-wing flip (boat drops flat!) • Caps yaw ≤455 N·m • Hall cuts prop in 0.05 s.</text>
  <rect x="532" y="68" width="484" height="262" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="550" y="92" class="sec">B. Side Profile: Strut Kick-Up vs. 12° Down-Exit Socket</text>
  <text x="550" y="109" class="dim">Center shoal (~140 kgf) → Strut kicks up • Tip hit (~70 kgf) → Wing pops down-aft</text>
