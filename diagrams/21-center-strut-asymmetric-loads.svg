  <rect x="1" y="1" width="1038" height="638" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1016" height="572" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">21. 2× Recessed Center Struts &amp; Symmetric Central V-Cradle Breakaway Socket</text>
  <text x="24" y="46" class="sub">Anti-Jam 120° Open-Aft V-Cradle (Both Wing Halves Eject Together!) + Wide T-Head &amp; Pod Saddle Trunnions</text>
  <rect x="24" y="68" width="484" height="262" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Top-Down: Symmetric Central 120° V-Cradle Socket</text>
  <text x="42" y="109" class="ok">BOTH halves pop aft together (0 half-wing flip!) • 760 mm struts react yaw!</text>
