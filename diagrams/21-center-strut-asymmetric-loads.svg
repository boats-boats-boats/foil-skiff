  <text x="363" y="244" class="warn">-F_lat (Stbd)</text>
  <line x1="201.0" y1="142.0" x2="309.0" y2="142.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="255.0" y="136.0" text-anchor="middle" class="dim">760 mm Tandem</text>
  <text x="42" y="302" class="ok">Stage 1 Fuse: Ø5 mm Delrin tip pin shears @ ~70 kgf → tip folds 90° aft!</text>
  <text x="42" y="318" class="lbl-sm">Caps yaw torque Mz ≤ 500 N·m (3× lower) &amp; sheds crab-pot lines cleanly.</text>
  <rect x="532" y="68" width="484" height="262" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="550" y="92" class="sec">B. Side Profile: Offset Pins, Stop Shoulder &amp; Fuse</text>
  <text x="550" y="109" class="dim">Zero cruise backlash • Clean kick-up @ ~140 kgf • Crab-pot line cutter</text>
  <rect x="560" y="136" width="420" height="16" rx="3" fill="url(#alu)" stroke="#334155" stroke-width="1.3"/>
  <rect x="652" y="152" width="44" height="20" rx="2" fill="#334155" stroke="#0F172A" stroke-width="1.2"/>
  <circle cx="674" cy="162" r="4.8" fill="#EF4444" stroke="#7F1D1D" stroke-width="1.2"/>
