  <text x="606" y="512" class="sec">3-Stage Resettable Impact &amp; Beaching System</text>
  <text x="606" y="536" class="warn">1. True 90° Upper &amp; Lower Fold Channels (220 mm Wide!):</text>
  <text x="616" y="552" class="lbl-sm">• Main Wing (2×102 mm) nests 90° flush in 12 mm belly channel; Switchblade</text>
  <text x="616" y="566" class="lbl-sm">  or Upper Staggerwing nests 90° flush in 13 mm roof channel (0 drag!).</text>
  <text x="606" y="592" class="ok">2. Dual Wet IP68 Servo Variable-Preload Roller Pins:</text>
  <text x="616" y="608" class="lbl-sm">• Foil pin (~85 kgf tip) &amp; Strut pin (~140 kgf shoal) lock over-center at 0 W,</text>
  <text x="616" y="622" class="lbl-sm">  drop to 0% for Dyneema fold/beaching, &amp; reset in 5 s (0 broken pins!).</text>
  <text x="606" y="648" class="dim">3. Wide Full-Span Trunnions + Twin 6 mm Internal Bulkheads:</text>
  <text x="616" y="664" class="lbl-sm">• Upper 250 mm Ø16 axle + UHMW thrust washers (μ≈0.08) + Lower 180 mm</text>
  <text x="616" y="678" class="lbl-sm">  pod saddle into twin 6 mm G10 bulkheads carry all roll &amp; side thrust.</text>
  <text x="616" y="698" class="ok">• Bolt-On Alt: External foil-base 90° knuckles (~350 mm) if pod untouched.</text>
