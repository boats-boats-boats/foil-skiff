  <text x="304.0" y="249.0" text-anchor="middle" class="ok">&gt;85 mm CLEAR!</text>
  <text x="148" y="339" text-anchor="middle" class="dim">Seated Main Wing</text>
  <text x="356" y="349" text-anchor="middle" class="ok">Ejected Wing (12° exit)</text>
  <text x="356" y="361" text-anchor="middle" class="lbl-sm">0.35 m leash stops 0.5 m before prop!</text>
  <text x="42" y="436" class="ok">1. Zero Conflict in Cruise (98% of flight time &amp; all high-speed hits!):</text>
  <text x="52" y="454" class="lbl-sm">• UP Staggerwing flaperons sit 57 mm above Main Wing (&gt;85 mm clear of exit!).</text>
  <text x="52" y="472" class="lbl-sm">• Works seamlessly with ALL 4 breakaway options (V-Cradle, Cam, C-Hook, Kingpin).</text>
  <text x="42" y="496" class="dim">2. Also applies 100% of the time for Fixed Upper Staggerwing &amp; Roof Switchblade:</text>
  <text x="52" y="514" class="lbl-sm">• Because rear surfaces never drop below pod belly, collision is physically impossible.</text>
