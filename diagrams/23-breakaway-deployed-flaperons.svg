<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="carbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="wingBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="wingTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="kevlar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <marker id="arrDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 18px; font-weight: 700; fill: #0F172A; }
      .sub { font-size: 12px; fill: #475569; }
      .sec { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .lbl { font-size: 11px; font-weight: 600; fill: #1E293B; }
      .lbl-sm { font-size: 10px; fill: #475569; }
      .lbl-w { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
      .dim { font-size: 10px; font-weight: 600; fill: #0284C7; }
      .ok { font-size: 10.5px; font-weight: 700; fill: #059669; }
      .warn { font-size: 10.5px; font-weight: 700; fill: #DC2626; }
    </style>
  </defs>
  <rect x="1" y="1" width="1078" height="578" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="12" y="56" width="1056" height="512" rx="8" fill="url(#grid)" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="28" class="title">23. Unified Linked-Fold Clearance: All 3 Wing Tracks &amp; 600 mm Tunnel Beaching Dart</text>
  <text x="24" y="46" class="sub">Zero Collision Across Switchblade (+65 mm), Upper Staggerwing (+55 mm) &amp; Feathered DOWN STOL (-7.5 mm) — 400 mm Folded Width!</text>
  <rect x="24" y="68" width="508" height="486" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="42" y="92" class="sec">A. Side Profile: Separate Vertical Sweep Planes (0° → 82°)</text>
  <text x="42" y="109" class="ok">Every secondary track sweeps on its own Z-plane — physically impossible to clash!</text>
  <rect x="36" y="118" width="484" height="292" rx="6" fill="url(#water)"/>
  <text x="46" y="134" class="lbl-sm">← BOW (All 3 Tracks Shown on 90 mm Pod)</text>
  <text x="510" y="134" text-anchor="end" class="lbl-sm">STERN →</text>
  <rect x="52" y="194" width="404" height="108" rx="38" fill="#334155" fill-opacity="0.16" stroke="#0F172A" stroke-width="1.8"/>
  <rect x="456" y="234" width="16" height="28" rx="3" fill="#334155"/>
  <line x1="474" y1="188" x2="474" y2="308" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="128" y="190" width="218" height="10" rx="3" fill="#0F766E" stroke="#134E4A" stroke-width="1.3"/>
  <text x="236" y="180" text-anchor="middle" class="ok">Track A: Roof Switchblade (Z = +45 mm, +65 mm clear!)</text>
  <rect x="228" y="210" width="152" height="10" rx="3" fill="#F97316" stroke="#9A3412" stroke-width="1.3"/>
  <text x="304" y="232" text-anchor="middle" class="warn">Track B: Upper Staggerwing (Z = +35 mm)</text>
  <rect x="116" y="264" width="256" height="13" rx="3" fill="url(#wingBlue)" stroke="#0369A1" stroke-width="1.5"/>
  <text x="244" y="258" text-anchor="middle" class="dim">Linked-Fold Main Wing (Z = -20 mm, 10 mm thick)</text>
  <rect x="228" y="288" width="152" height="9" rx="3" fill="#10B981" stroke="#065F46" stroke-width="1.3"/>
  <text x="304" y="316" text-anchor="middle" class="ok">Track C: Triggered DOWN STOL Flap (Z = -36 mm)</text>
  <text x="304" y="329" text-anchor="middle" class="lbl-sm">Dog-clutch releases → feathers 0° (7.5 mm below Main Wing!)</text>
  <line x1="102.0" y1="195.0" x2="102.0" y2="270.0" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="78.0" y="236.5" text-anchor="middle" class="ok">+65 mm</text>
  <line x1="402.0" y1="277.0" x2="402.0" y2="288.0" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="428.0" y="286.5" text-anchor="middle" class="ok">7.5 mm</text>
  <text x="42" y="436" class="ok">1. Track A (Switchblade) &amp; Track B (Fixed Upper Staggerwing) = Simplest:</text>
  <text x="52" y="454" class="lbl-sm">• 55–65 mm vertical clearance above Main Wing → zero timing/trigger needed!</text>
  <text x="42" y="478" class="dim">2. Track C (Split STOL / Morphing DOWN Flaperons) = Triggered Self-Feather:</text>
  <text x="52" y="496" class="lbl-sm">• Internal trigger cable releases flaperon dog-clutches @ 5° Main Wing sweep →</text>
  <text x="52" y="512" class="lbl-sm">  flaps self-feather to 0° (20% balance) and sweep 82° aft 7.5 mm below Main Wing!</text>
  <rect x="548" y="68" width="508" height="486" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="566" y="92" class="sec">B. Top-Down: Folded 400 mm Dart Inside 600 mm Tunnel</text>
  <text x="566" y="109" class="ok">1.55 m (AR 14) foil + 1.12 m flaperons fold 100% between Ø460 mm tubes!</text>
  <rect x="560" y="118" width="484" height="292" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="566" y="126" width="472" height="28" rx="12" fill="#CBD5E1" stroke="#64748B" stroke-width="1.3"/>
  <rect x="566" y="374" width="472" height="28" rx="12" fill="#CBD5E1" stroke="#64748B" stroke-width="1.3"/>
  <text x="802" y="144" text-anchor="middle" class="lbl-sm">Port Ø460 mm Inflatable Tube Edge</text>
  <text x="802" y="392" text-anchor="middle" class="lbl-sm">Starboard Ø460 mm Inflatable Tube Edge</text>
  <rect x="604" y="226" width="350" height="76" rx="34" fill="url(#carbon)" stroke="#0F172A" stroke-width="1.6"/>
  <rect x="646" y="236" width="176" height="22" rx="4" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <rect x="646" y="270" width="176" height="22" rx="4" fill="#0F766E" stroke="#134E4A" stroke-width="1.1"/>
  <line x1="974" y1="230" x2="974" y2="298" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
  <text x="1008" y="268" text-anchor="middle" class="dim">Prop</text>
  <polygon points="670,228 898,190 896,210 674,244" fill="#F97316" fill-opacity="0.92" stroke="#9A3412" stroke-width="1.4"/>
  <polygon points="670,300 898,338 896,318 674,284" fill="#F97316" fill-opacity="0.92" stroke="#9A3412" stroke-width="1.4"/>
  <polygon points="724,226 860,206 858,218 726,236" fill="url(#wingBlue)" fill-opacity="0.92" stroke="#0369A1" stroke-width="1.3"/>
  <polygon points="724,302 860,322 858,310 726,292" fill="url(#wingBlue)" fill-opacity="0.92" stroke="#0369A1" stroke-width="1.3"/>
  <line x1="586.0" y1="154.0" x2="586.0" y2="374.0" stroke="#0284C7" stroke-width="1.2" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="610.0" y="182.0" text-anchor="middle" class="dim">600 mm</text>
  <line x1="916.0" y1="192.0" x2="916.0" y2="336.0" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="946.0" y="352.0" text-anchor="middle" class="ok">~400 mm</text>
  <line x1="898.0" y1="172.0" x2="974.0" y2="172.0" stroke="#059669" stroke-width="1.2" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)"/>
  <text x="936.0" y="166.0" text-anchor="middle" class="ok">227 mm clear!</text>
  <text x="566" y="436" class="ok">Why Unified Linked-Fold Replaces 4 Separate Mechanisms:</text>
  <text x="576" y="454" class="lbl-sm">• Impact Protection: Both halves sweep 82° together (0 rollover, 0 leash!).</text>
  <text x="576" y="472" class="lbl-sm">• Dry-Sand Beaching: 1.55 m LR foil folds to ~400 mm inside 600 mm tunnel!</text>
  <text x="576" y="490" class="lbl-sm">• Eliminates fragile mid-span wingtip hinges &amp; 1.12 m rear flaperon overhang.</text>
  <text x="576" y="508" class="lbl-sm">• Compact Storage: Entire folded pod drops straight into a 1.3 m × 0.4 m bag!</text>
</svg>
